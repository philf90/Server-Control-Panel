name: Wächter brechen

# **Warum das ein eigener Lauf ist und nicht ein Job in `ci.yml`.**
#
# Zwei Gründe, und beide sind praktischer Natur:
#
# 1. Das Skript **ändert Dateien** im Arbeitsbaum und stellt sie über git wieder
#    her. In einem Lauf, der nebenher ein Paket baut, wäre das ein Wettlauf um
#    denselben Baum.
# 2. Es fährt PHPUnit einmal je Prüfung — **1951 Eingriffe, 3360 Prüfungen**
#    am 11. Oktober 2026 (am 15. September 1335 und 2466, im August 376 und
#    623). In `ci.yml` hinge das an einem Job, der ohnehin schon die ganze
#    Suite fährt.
#
# **Und warum es ihn überhaupt gibt.** CLAUDE.md verlangt: „Ein Wächter, der nie
# rot war, ist kein Wächter." Das Skript stand seit dem Optik-Rework im Repo und
# ist **nie vollständig gelaufen** — in der Entwicklungsumgebung fehlt `vendor/`,
# also wurde es von Hand und stückweise gefahren. Genau dort ist es dreimal in
# einer Woche fündig geworden.
#
# > **Ein Werkzeug, das man nur von Hand fährt, fährt irgendwann niemand mehr.**

on:
  workflow_dispatch:
  # **Und seit dem 13. August 2026 auch an jedem Pull Request.**
  #
  # Hier stand: „Über zweihundert Läufe gehören nicht vor jeden Pull Request,
  # sondern regelmässig und auf Zuruf." Die Zahl stimmte, die Folgerung nicht —
  # der Lauf dauerte damals fünf Minuten, weniger als der Installationsjob auf
  # Ubuntu 22.04, den niemand infrage stellt. Die Vorsicht galt einer Rechnung,
  # die nie jemand gemacht hat.
  #
  # **Diese Begründung trägt seit August nicht mehr, die Entscheidung schon.**
  # Gemessen am 15. September 2026 braucht der Lauf **22,5 Minuten im Median**,
  # der Installationsjob rund zwei — das Verhältnis hat sich umgekehrt, und
  # dieser Lauf ist heute der Taktgeber jedes Pull Requests. Was ihn trägt, ist
  # nicht mehr sein geringer Preis, sondern der Befund vom 13. August: zwei Tage
  # lang stand im Repo ein Wächter, den es nicht mehr gab.
  #
  # > **Eine Entscheidung überlebt ihre Begründung — und wer nur die Begründung
  # > nachliest, hält sie für widerlegt.**
  #
  # **Gesenkt hat den Preis am 11. Oktober 2026 keine Teilung, sondern eine
  # Zeile in `pruefe`.** Bis dahin lud jede Prüfung die ganze Suite — 527
  # Dateien, 4028 Fälle —, um einen davon zu fahren; am 10. Oktober dauerte der
  # Lauf 46 bis 49 Minuten. Seitdem bekommt PHPUnit die Datei des Falls, und
  # derselbe Stand braucht 13 Minuten. Die Teilung auf parallele Jobs hätte die
  # Wanduhr geteilt und den Preis je Prüfung stehen lassen; sie ist damit vom
  # Tisch.
  #
  # Entschieden hat es ein Befund: Am 13. August meldete der Wochenlauf drei
  # Prüfungen ohne Biss, und alle drei hingen an einem Umbau vom 11. — zwei Tage
  # lang stand im Repo ein Wächter, den es nicht mehr gab, und einer, der seine
  # Regel nicht hielt. An dem Pull Request, der sie verlor, wäre es sofort
  # aufgefallen.
  #
  # > **Ein Lauf, der wöchentlich prüft, findet Fehler, die eine Woche alt sein
  # > dürfen.**
  pull_request:
  schedule:
    # Montags um 04:00 UTC. Der Zeitplan **bleibt**, obwohl der Lauf jetzt an
    # jedem Pull Request hängt: Er ist der einzige, der auch dann fährt, wenn
    # wochenlang niemand etwas ändert — und was er dann findet, ist kein Fehler
    # von heute, sondern eine Regel, die von aussen gebrochen wurde: eine neue
    # PHP-Fassung, ein anderes Verhalten einer Abhängigkeit.
    - cron: '0 4 * * 1'

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'

jobs:
  brechen:
    name: Jede Regel absichtlich brechen
    runs-on: ubuntu-latest

    # **Gemessen am 11. Oktober 2026** in der CI, zweimal an denselben 3360
    # Prüfungen: Lauf 38115760774 auf `255969ea` brauchte für den Schritt
    # `tests/waechter-brechen.sh` **13 min 20 s**, Lauf 38117644671 auf
    # `824affdc` eine halbe Stunde später **19 min 27 s** — 0,24 und 0,35 s je
    # Prüfung. Derselbe Stand brauchte am Tag davor über die Suite 46,5 Minuten,
    # 0,83 s je Prüfung. Am 15. September waren es 22,5 Minuten im Median über
    # 50 Läufe, bei 2466 Prüfungen.
    #
    # **Hier stand „sechzig, und die Zahl ist gerechnet und nicht gegriffen"**,
    # gerechnet gegen 0,68 s je Prüfung im langsamsten Lauf, und die Rechnung
    # sagte zwei Monate. Getragen hat die Grenze knapp vier Wochen: Der Preis je
    # Prüfung wuchs nicht nur mit der Zahl der Prüfungen, sondern mit der Suite,
    # die jede von ihnen lud. Am 10. Oktober standen 49 von 60 Minuten.
    #
    # > **Eine Hochrechnung über eine Grösse, die selbst wächst, rechnet mit dem
    # > Wert von heute und wird von dem von morgen überholt.**
    #
    # **Am selben Morgen stand hier zuerst dreissig.** Gerechnet war das aus dem
    # ersten Lauf allein, als wäre er ein mittlerer, mit dem 1,31-fachen für den
    # langsamsten: 17,4 Minuten. Der zweite Lauf brauchte 19,5. Wie weit zwei
    # Läufe derselben Arbeit auseinanderliegen, steht in den Schritten der
    # früheren: Zwei Läufe, die binnen drei Stunden starten, liegen im Median um
    # das 1,12-fache auseinander, in jedem zwanzigsten Paar um mehr als das
    # 1,57-fache und höchstens um das 1,72-fache — 80 Paare aus 221 Läufen seit
    # August, alle noch über die Suite. Die beiden von heute liegen mit dem
    # 1,46-fachen darin.
    #
    # > **Ein einzelner Lauf sagt nicht, ob er ein schneller war — wer ihn als
    # > Mitte nimmt, rechnet mit seinem Glück.**
    #
    # **Vierzig, gerechnet gegen den langsamsten Fall.** Das 1,72-fache des
    # schnellen Laufs sind 22,9 Minuten, 0,41 s je Prüfung. Das Skript wuchs vom
    # 15. September bis zum 11. Oktober um 894 Prüfungen, 34 am Tag, und die
    # kosten in diesem Fall 14 Sekunden am Tag. Vierzig Minuten tragen damit
    # **rund 73 Tage** — die Spanne von zwei Monaten, die der Satz vom September
    # für richtig hielt. Dreissig trügen einen Monat, sechzig fünf. Seit jede
    # Prüfung ihre eigene Datei lädt, wächst ihr Preis nicht mehr mit der Suite;
    # die Rechnung vom September hatte genau das gegen sich.
    #
    # **Und warum die Grenze überhaupt drängt**, ist nicht die verlorene Zeit,
    # sondern dass ein abgeschnittener Lauf sich als roter liest — der Nächste
    # sucht dann am Skript statt an der Grenze.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sockets, pcntl, posix, mbstring, intl, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Der Arbeitsbaum ist sauber
        # Das Skript weigert sich bei ungesicherten Änderungen, weil es sie mit
        # `git checkout --` wegwerfen würde. Hier kann das nicht passieren — die
        # Zeile steht trotzdem da, damit ein Fehlschlag den Grund nennt und
        # nicht bloss den Rückgabewert 1.
        run: git diff --quiet || (echo "::error::Der Arbeitsbaum ist nicht sauber." && exit 1)

      - name: tests/waechter-brechen.sh
        run: tests/waechter-brechen.sh
