# Eigene nginx-Direktiven für die Panel-Oberfläche.
#
# Diese Datei gehört dir. Der Agent erzeugt den Server-Block daneben neu, wenn
# sich Port oder Zertifikat ändern — was hier steht, bleibt davon unberührt und
# wird am Ende des Blocks eingebunden.
#
# Beispiel: Zugriff auf das Panel auf ein Netz begrenzen.
#
#   allow 203.0.113.0/24;
#   allow 127.0.0.1;
#   deny all;
