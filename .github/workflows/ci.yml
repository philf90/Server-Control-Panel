name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # "stable" statt einer festen Nummer oder go-version-file:
          #
          # go.mod nennt mit "go 1.25.0" eine Untergrenze, keine Wunschversion.
          # Würde die CI genau diese Version installieren, liefe der Build gegen
          # eine Standardbibliothek mit allen seither behobenen Lücken — genau
          # das meldete govulncheck (25 Funde, behoben in 1.25.1 bis 1.25.3).
          #
          # Eine ältere Version als go.mod verlangt ist ebenfalls falsch: Go lädt
          # dann zur Laufzeit eine Toolchain nach, und in dieser fehlte "covdata",
          # woran der Testlauf scheiterte, obwohl alle Tests grün waren.
          #
          # "stable" ist immer mindestens so neu wie die Untergrenze und enthält
          # die aktuellen Sicherheitskorrekturen.
          go-version: stable

      - name: Formatierung
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Nicht formatiert:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Abdeckung der sicherheitsrelevanten Pakete
        # Die Schwellen sind ein Sperrklinken-Mechanismus gegen Rückschritt,
        # keine runden Wunschzahlen: Sie liegen knapp unter dem heutigen Stand.
        # Gemessen wird die Statement-Abdeckung aus dem Testlauf — der
        # Mittelwert über Funktionen wäre irreführend, weil er eine
        # dreizeilige Funktion so stark gewichtet wie eine dreißigzeilige.
        run: |
          set -euo pipefail
          go test -coverprofile=/dev/null ./... > coverage.txt
          cat coverage.txt

          check() {
            pkg="$1"; floor="$2"
            pct="$(grep -E "internal/${pkg}\s" coverage.txt \
                   | grep -oE 'coverage: [0-9.]+%' | grep -oE '[0-9.]+' || echo 0)"
            printf 'internal/%-10s %5s %% (Grenze %s %%)\n' "$pkg" "$pct" "$floor"
            if [ "$(printf '%.0f' "$pct")" -lt "$floor" ]; then
              echo "Abdeckung von internal/${pkg} liegt unter ${floor} %."
              exit 1
            fi
          }

          # Pakete, die die Angriffsfläche tragen.
          check auth    85
          check privops 72
          check store   78
          check certs   78
          check config  88
          # acme besorgt das Zertifikat, mit dem alles andere geschützt wird.
          # Der Anteil ist niedriger als bei den übrigen, weil der Weg gegen
          # einen echten CA nur auf einem Server mit öffentlichem Namen läuft;
          # geprüft ist, was ohne ihn prüfbar ist.
          check acme    55
          # update trägt die Signaturprüfung und den Austausch des Binaries.
          check update  85
          # httpd besteht zu einem großen Teil aus Anzeigelogik; die
          # sicherheitsrelevanten Pfade darin (Sitzung, CSRF, Rollen) sind
          # eigens getestet.
          check httpd   63

      - name: Build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "/tmp/asylumd_${arch}" ./cmd/asylumd
          done
          ls -l /tmp/asylumd_*

      - name: Binärgröße prüfen
        # Grenze aus docs/06-roadmap.md. Sie steht hier, damit "schlank" eine
        # Zusage bleibt und kein Marketingbegriff wird.
        run: |
          max=$((30 * 1024 * 1024))
          for f in /tmp/asylumd_amd64 /tmp/asylumd_arm64; do
            size="$(stat -c%s "$f")"
            echo "$(basename "$f"): $((size / 1024 / 1024)) MB"
            if [ "$size" -gt "$max" ]; then
              echo "Binärgröße überschreitet 30 MB."
              exit 1
            fi
          done

  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # v8 ist die erste Fassung, die golangci-lint v2 und dessen
      # Konfigurationsformat versteht. Mit v6 brach der Job nach 95 ms mit
      # Code 3 ab: unlesbare Konfiguration.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12

  shell:
    name: Shell-Skripte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck packaging/install.sh packaging/nfpm/*.sh packaging/release-dry-run.sh

  release-probe:
    name: Freigabepipeline probeweise
    runs-on: ubuntu-latest
    # Der Schritt, der Landingpage und Update-Metadaten schreibt, lief bisher
    # erstmals dann, wenn ein Tag gesetzt war — also genau dann, wenn ein
    # Fehler teuer ist. Zwei Freigaben sind daran gescheitert. Hier läuft er
    # unverändert gegen eine Attrappe, bevor jemand taggt.
    steps:
      - uses: actions/checkout@v4
      - name: Probelauf
        run: |
          python3 -m pip install --quiet pyyaml
          ./packaging/release-dry-run.sh

  keys:
    name: Signaturschlüssel
    runs-on: ubuntu-latest
    # Der eingebaute minisign-Schlüssel wird von einem Test in internal/update
    # geprüft. Hier geht es um den zweiten Schlüssel: den des APT-Repositories.
    # Er taucht an drei Stellen auf — als Schlüsselbund, als Textfassung und
    # als Fingerprint in der Dokumentation. Laufen die auseinander, merkt es
    # sonst zuerst ein Nutzer, dessen apt-update mit NO_PUBKEY abbricht.
    steps:
      - uses: actions/checkout@v4
      - name: Schlüsselbund, Textfassung und Dokumentation vergleichen
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"

          fpr() { gpg --show-keys --with-colons "$1" | awk -F: '/^fpr/{print $10; exit}'; }
          binary="$(fpr packaging/asylum-archive-keyring.gpg)"
          armored="$(fpr packaging/asylum-archive-keyring.asc)"

          if [ -z "$binary" ]; then
            echo "packaging/asylum-archive-keyring.gpg enthält keinen lesbaren Schlüssel."
            exit 1
          fi
          if [ "$binary" != "$armored" ]; then
            echo "Schlüsselbund ($binary) und Textfassung ($armored) sind verschiedene Schlüssel."
            exit 1
          fi
          if ! grep -qF "$binary" docs/05-updates.md; then
            echo "Der Fingerprint $binary steht nicht in docs/05-updates.md."
            exit 1
          fi

          # Ein privater Schlüssel gehört niemals ins Repository.
          if gpg --list-packets packaging/asylum-archive-keyring.gpg 2>/dev/null \
             | grep -qi "secret key"; then
            echo "Die Datei enthält privates Schlüsselmaterial."
            exit 1
          fi
          echo "APT-Signaturschlüssel stimmig: $binary"

  security:
    name: Schwachstellen und Lizenzen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Lizenzen der Abhängigkeiten
        # Kein GPL-/AGPL-Code im statisch gelinkten Binary — siehe
        # docs/07-name-lizenz-domain.md.
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... \
            --disallowed_types=forbidden,restricted,reciprocal
