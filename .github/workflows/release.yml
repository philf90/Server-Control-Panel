name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Bauen, signieren, veröffentlichen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # Siehe ci.yml: die aktuelle stabile Fassung, nicht die Untergrenze
          # aus go.mod — sonst wird gegen eine Standardbibliothek mit bekannten
          # Lücken gebaut und ausgeliefert.
          go-version: stable

      - name: Tests vor dem Release
        run: go test ./...

      - name: minisign bereitstellen
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -z "$MINISIGN_KEY" ]; then
            echo "Secret MINISIGN_KEY fehlt — ohne Signatur wird nicht veröffentlicht."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          umask 077
          # Der Schlüssel ist zweizeilig; printf ohne abschließenden Zeilenumbruch
          # würde ihn unbrauchbar machen.
          printf '%s\n' "$MINISIGN_KEY" > "${RUNNER_TEMP}/minisign.key"

      - name: Signaturschlüssel gegen den veröffentlichten Public Key prüfen
        # Ein vertauschtes Secret fällt sonst erst auf, wenn der Installer bei
        # den Nutzern die Signatur ablehnt.
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          umask 077
          echo "probe" > "${RUNNER_TEMP}/probe.txt"
          # Bei einem Schlüssel ohne Passwort ist die Eingabe leer und wird
          # ignoriert; mit Passwort liest minisign sie von stdin.
          printf '%s\n' "${MINISIGN_PASSWORD:-}" \
            | minisign -s "${RUNNER_TEMP}/minisign.key" -Sm "${RUNNER_TEMP}/probe.txt" > /dev/null
          minisign -Vm "${RUNNER_TEMP}/probe.txt" -P "$(tail -n1 packaging/minisign.pub)" \
            > /dev/null
          echo "Der hinterlegte Schlüssel passt zu packaging/minisign.pub."

      - uses: anchore/sbom-action/download-syft@v0

      - name: Version bestimmen
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_KEY_FILE: ${{ runner.temp }}/minisign.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}

      - name: Artefakte für den Pages-Job sichern
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
            dist/*.deb
          retention-days: 1

  publish:
    name: repo.cloudsrv24.de aktualisieren
    needs: release
    runs-on: ubuntu-latest
    # Vorabversionen landen nicht im Stable-Kanal.
    steps:
      - name: Quellstand des Tags auschecken
        uses: actions/checkout@v4
        with:
          path: src

      - name: Pages-Branch auschecken
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Kanal bestimmen
        id: channel
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) echo "name=beta"   >> "$GITHUB_OUTPUT" ;;
            *)   echo "name=stable" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Installer und Update-Metadaten schreiben
        env:
          VERSION: ${{ needs.release.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd pages

          # CNAME und .nojekyll gehören der Pages-Konfiguration und werden hier
          # niemals angefasst.
          test -f CNAME || echo "WARNUNG: CNAME fehlt im Pages-Branch"
          touch .nojekyll

          cp ../src/packaging/install.sh install.sh
          chmod 0644 install.sh
          # Der Public Key liegt zum Nachprüfen daneben — wer dem Skript nicht
          # traut, vergleicht ihn mit dem Repository.
          cp ../src/packaging/minisign.pub minisign.pub
          mkdir -p updates

          # Landingpage. Sobald .nojekyll gesetzt ist, rendert GitHub Pages
          # keine Markdown-Dateien mehr — ohne index.html liefe die Wurzel der
          # Domain in einen 404.
          pubkey="$(tail -n1 minisign.pub)"
          cat > index.html <<HTML
          <!doctype html>
          <html lang="de">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Project Asylum</title>
          <style>
          :root{color-scheme:light dark}
          body{margin:0;padding:3rem 1.25rem;font:16px/1.6 system-ui,sans-serif;
               max-width:44rem;margin-inline:auto}
          h1{margin:0;font-size:1.6rem}
          .claim{margin:.35rem 0 2rem;color:#2f6f4f;font-size:.85rem;font-weight:600}
          pre{padding:1rem;border-radius:8px;overflow-x:auto;
              background:rgba(127,127,127,.12)}
          code{font-family:ui-monospace,Menlo,monospace;font-size:.9em}
          footer{margin-top:2.5rem;font-size:.8rem;opacity:.7}
          </style>
          </head>
          <body>
          <h1>Project Asylum</h1>
          <p class="claim">Administration · Security · YAML · Logs · Updates · Monitoring</p>
          <p>Schlankes Control Panel für Ubuntu- und Debian-Server. Ein Binary,
          keine Runtime-Abhängigkeiten.</p>
          <pre><code>curl -fsSL --proto '=https' --tlsv1.2 https://repo.cloudsrv24.de/install.sh -o install.sh
          sudo bash install.sh</code></pre>
          <p>Der Installer prüft Signatur und Prüfsumme jedes Artefakts. Öffentlicher
          Signaturschlüssel (<a href="/minisign.pub">minisign.pub</a>):</p>
          <pre><code>${pubkey}</code></pre>
          <footer>
          Version ${VERSION} · <a href="https://github.com/${REPO}">Quellcode</a> ·
          <a href="https://github.com/${REPO}/releases/tag/v${VERSION}">Release-Notizen</a> ·
          Apache-2.0
          </footer>
          </body>
          </html>
          HTML

          sha_for() {
            grep " asylumd_${VERSION}_linux_${1}.tar.gz\$" ../dist/SHA256SUMS | awk '{print $1}'
          }
          base="https://github.com/${REPO}/releases/download/v${VERSION}"

          cat > "updates/${CHANNEL}.json" <<JSON
          {
            "version": "${VERSION}",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "min_upgradable_from": "0.1.0",
            "notes_url": "https://github.com/${REPO}/releases/tag/v${VERSION}",
            "severity": "normal",
            "artifacts": {
              "linux_amd64": {
                "url": "${base}/asylumd_${VERSION}_linux_amd64.tar.gz",
                "sha256": "$(sha_for amd64)"
              },
              "linux_arm64": {
                "url": "${base}/asylumd_${VERSION}_linux_arm64.tar.gz",
                "sha256": "$(sha_for arm64)"
              }
            }
          }
          JSON

          python3 -m json.tool "updates/${CHANNEL}.json" >/dev/null

      - name: Veröffentlichen
        run: |
          cd pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "chore(pages): Release ${{ needs.release.outputs.version }}"
          git push
