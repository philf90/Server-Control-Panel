; PHP-FPM für die Panel-Oberfläche.
;
; Ein eigener Pool mit eigener Konfiguration, getrennt von dem, was die
; Distribution mitbringt: Das Panel soll nicht mitwandern, wenn jemand die
; PHP-Einstellungen des Systems ändert — und die PHP-Version der Kunden nicht
; von der des Panels abhängen.

[global]
pid = /run/srvpanel/fpm.pid
error_log = /var/log/srvpanel/fpm.log
daemonize = no

[srvpanel]
user = srvpanel
group = srvpanel

listen = /run/srvpanel/fpm.sock
listen.owner = srvpanel
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; Ein Vorgang mit Live-Ausgabe hält die Verbindung offen, solange er läuft.
; Das Standardlimit von 30 s würde ihn mitten im Lauf abschneiden.
request_terminate_timeout = 3600s

php_admin_value[error_log] = /var/log/srvpanel/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 256M
; Eine hochgeladene Sicherung darf 512 MB gross sein (docs/36 §10.3). Die
; Datei selbst begrenzt upload_max_filesize; post_max_size trägt sie plus die
; übrigen Felder des Formulars und liegt deshalb darüber. Die engste der drei
; Zahlen ist die Prüfregel des Panels — wer abgewiesen wird, soll dessen
; Meldung sehen und nicht die von PHP oder nginx.
php_admin_value[upload_max_filesize] = 512M
php_admin_value[post_max_size] = 544M
php_admin_value[sys_temp_dir] = /var/lib/srvpanel/tmp
php_admin_value[upload_tmp_dir] = /var/lib/srvpanel/tmp
php_admin_value[session.save_path] = /var/lib/srvpanel/tmp

; Das Panel liest und schreibt in seinem eigenen Bereich. Der Rest des
; Dateisystems geht über den Agenten — und nur über typisierte Operationen.
;
; **Die eine Ausnahme ist /etc/localtime, und sie ist am 7. September 2026 auf
; cloudsrv24 bezahlt worden.** `App\Support\Cron\ServerZone` liest den Symlink,
; um zu wissen, in welcher Zone cron rechnet. Auf der Kommandozeile ging das,
; im Web-Request nicht — und `current()` fiel dabei still auf UTC zurück. Die
; Cronseite zeigte für einen Job „jeden Tag um 03:15" die nächste Fälligkeit
; als 05:15: zwei Stunden daneben, seit es Cronjobs gibt.
;
;   Ein Rückfall, der immer etwas liefert, macht aus „unbekannt" eine falsche
;   Auskunft.
;
; **Ein Pfad und nicht zwei, und das ist gemessen.** `/usr/share/zoneinfo` wird
; nicht gebraucht: `ServerZone` ruft nur `readlink()` und öffnet das Ziel nie.
; Und der Eintrag macht sonst nichts auf — mit ihm bleiben `/etc/passwd`,
; `/etc/shadow`, die nginx-Konfiguration und selbst das Ziel des Symlinks
; unerreichbar (gemessen, alle vier).
php_admin_value[open_basedir] = /opt/srvpanel:/etc/srvpanel:/var/lib/srvpanel:/var/log/srvpanel:/run/srvpanel:/tmp:/etc/localtime
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

env[PATH] = /usr/local/bin:/usr/bin:/bin
