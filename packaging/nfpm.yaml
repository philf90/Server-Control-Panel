name: srvpanel
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: philf90 <philipp@netzhost24.de>
description: |
  SrvPanel — Hosting-Panel für einen einzelnen Linux-Server.
  Kunden, Abonnements, Domains, PHP, Datenbanken, DNS, Dateien und Sicherungen
  über eine Oberfläche, mit einem Systembenutzer je Abonnement.
vendor: SrvPanel
homepage: https://repo.cloudsrv24.de/
license: AGPL-3.0-only

# Das alte Paket des Vorgängers bleibt im Repository stehen und wird nicht
# ersetzt: Bestehende Installationen sollen weiterlaufen, nicht überschrieben
# werden. Es gibt keinen Migrationspfad, und ein Conflicts/Replaces würde
# einen vortäuschen.

# **Vollständig, nicht ungefähr.** Hier standen `php8.4-cli` und
# `php8.4-fpm`, und das reichte nur deshalb, weil install.sh die übrigen
# Erweiterungen vorher von Hand nachinstallierte. Wer `apt install srvpanel`
# tippte, bekam ein Panel ohne Datenbanktreiber: Die Ersteinrichtung lief bis
# zu den Migrationen und starb dort mit „could not find driver" — einer
# Meldung, die nicht sagt, welches Paket fehlt.
#
# Die CI hat das nicht gefunden, weil ihre Installationsläufe denselben Weg
# gehen wie install.sh und die Erweiterungen vor dem Paket einspielen. Die
# Abhängigkeiten eines Pakets kann man nur prüfen, indem man es allein
# installiert; genau das tut der Job „Nur das Paket, sonst nichts".
#
# Nicht aufgeführt, weil Debian sie in php8.4-cli bzw. php8.4-common
# mitbringt: ctype, filter, hash, openssl, session, tokenizer, json,
# fileinfo, iconv, phar, pcre — dazu sockets, posix und pcntl, die der Agent
# braucht.
depends:
  - nginx
  - curl
  - php8.4-cli
  - php8.4-fpm
  # pdo_mysql — ohne das keine Migration und keine Anmeldung.
  - php8.4-mysql
  # Laravel verlangt ext-mbstring ausdrücklich.
  - php8.4-mbstring
  # ext-dom, ext-libxml, ext-xmlwriter, ext-xml — von sechs Paketen im
  # Abhängigkeitsbaum verlangt.
  - php8.4-xml
  # Der HTTP-Client des Frameworks.
  - php8.4-curl
  - mariadb-server
  - quota
  - ca-certificates
recommends:
  - fail2ban
suggests:
  - postgresql

contents:
  - src: ./build/release
    dst: /opt/srvpanel/releases/${VERSION}
    type: tree

  - src: /opt/srvpanel/releases/${VERSION}
    dst: /opt/srvpanel/current
    type: symlink

  # **Der Schreibbereich gehört nicht in die Fassung.**
  #
  # Bis 0.2.0~rc.4 hieß das Fassungsverzeichnis wörtlich `${VERSION}` und
  # änderte sich nie. `storage` lag darin und war dadurch versehentlich
  # dauerhaft. Mit dem richtigen Namen ist jede Fassung ein neues Verzeichnis —
  # und damit wäre auch `storage` bei jedem Update neu: Das Protokoll des
  # Panels finge von vorn an, das alte bliebe in der alten Fassung liegen, und
  # alles, was ab P2 unter storage/app landet (Sicherungen, Dateien), wäre nach
  # einem Update fort.
  #
  # Ein Verweis nach /var/lib/srvpanel/storage löst beides: Der Schreibbereich
  # überlebt Updates, und das alte Fassungsverzeichnis lässt sich restlos
  # abräumen, weil nichts Bewahrenswertes mehr darin steht.
  - src: /var/lib/srvpanel/storage
    dst: /opt/srvpanel/releases/${VERSION}/storage
    type: symlink

  - src: ./packaging/systemd/srvpanel-agentd.service
    dst: /lib/systemd/system/srvpanel-agentd.service
  - src: ./packaging/systemd/srvpanel-web.service
    dst: /lib/systemd/system/srvpanel-web.service
  - src: ./packaging/systemd/srvpanel-worker.service
    dst: /lib/systemd/system/srvpanel-worker.service
  - src: ./packaging/systemd/srvpanel-metrics.service
    dst: /lib/systemd/system/srvpanel-metrics.service

  # Die Speichermessung ist der einzige Takt, der nicht als Dauerlauf kommt:
  # Timer und Dienst gehören zusammen, und ohne die .timer-Datei liefe der
  # Dienst genau nie.
  - src: ./packaging/systemd/srvpanel-usage.service
    dst: /lib/systemd/system/srvpanel-usage.service
  - src: ./packaging/systemd/srvpanel-usage.timer
    dst: /lib/systemd/system/srvpanel-usage.timer

  # Dasselbe für das Zertifikat der Oberfläche: Die Prüfung, ob es noch lange
  # genug gilt, gab es von Anfang an — sie lief nur nie, weil niemand sie
  # aufrief.
  - src: ./packaging/systemd/srvpanel-tls.service
    dst: /lib/systemd/system/srvpanel-tls.service
  - src: ./packaging/systemd/srvpanel-tls.timer
    dst: /lib/systemd/system/srvpanel-tls.timer

  - src: ./packaging/bin/php
    dst: /opt/srvpanel/bin/php
    file_info:
      mode: 0755
  - src: ./packaging/bin/php-fpm
    dst: /opt/srvpanel/bin/php-fpm
    file_info:
      mode: 0755
  - src: ./packaging/bin/srvpanel
    dst: /usr/local/bin/srvpanel
    file_info:
      mode: 0755

  - src: ./packaging/etc/fpm.conf
    dst: /etc/srvpanel/fpm.conf
    type: config|noreplace
  - src: ./packaging/etc/nginx-extra.conf
    dst: /etc/srvpanel/nginx-extra.conf
    type: config|noreplace

  - src: ./packaging/etc/agent.json
    dst: /etc/srvpanel/agent.json
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: srvpanel
  - src: ./packaging/etc/logrotate
    dst: /etc/logrotate.d/srvpanel
    type: config|noreplace

  - dst: /etc/srvpanel/tls
    type: dir
    file_info:
      mode: 0755
  - dst: /var/lib/srvpanel
    type: dir
    file_info:
      mode: 0750
      owner: srvpanel
      group: srvpanel
  - dst: /var/log/srvpanel
    type: dir
    file_info:
      mode: 0750
      owner: srvpanel
      group: srvpanel
  - dst: /var/www/vhosts
    type: dir
    file_info:
      mode: 0755
      owner: root
      group: root

scripts:
  preinstall: ./packaging/scripts/preinstall.sh
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh

deb:
  fields:
    Bugs: https://github.com/philf90/Server-Control-Panel/issues
