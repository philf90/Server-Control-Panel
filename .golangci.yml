version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - nilerr
    - noctx
    - revive
    - unconvert
    - wastedassign

  settings:
    gosec:
      excludes:
        # G104 doppelt sich mit errcheck.
        - G104
    revive:
      rules:
        - name: exported
          disabled: true
    staticcheck:
      # ST1005 verlangt kleingeschriebene Fehlermeldungen. Die Regel stammt aus
      # dem englischen Sprachgebrauch; dieses Projekt gibt seine Meldungen auf
      # Deutsch aus, und dort sind Substantive großzuschreiben. Ein
      # kleingeschriebenes "paketname" wäre schlicht falsches Deutsch.
      checks:
        - all
        - -ST1005

  exclusions:
    rules:
      # In Tests sind Hilfsdateien mit weiten Rechten und feste Pfade in
      # Ordnung; die strengen Regeln gelten dem Produktivcode.
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt

# misspell ist bewusst nicht aktiv: Der Wortschatz dieses Projekts ist deutsch,
# und der Linter meldet "Konfiguration" als Falschschreibung von
# "Configuration". Rechtschreibprüfung auf Englisch passt hier nicht.

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
