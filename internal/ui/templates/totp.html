{{define "totp"}}{{template "header" .}}
<div class="card">
  <h1>Zwei-Faktor einrichten</h1>
  <p>
    Ohne zweiten Faktor geht es nicht weiter — ein Panel mit root-Rechten
    braucht mehr als ein Passwort.
  </p>

  <div class="qr">
    <img src="/setup/2fa/qr.png" alt="QR-Code für die Authenticator-App" width="220" height="220">
  </div>

  <p class="hint">
    Lässt sich der Code nicht scannen, das Geheimnis manuell eintragen:<br>
    <code class="secret">{{.Content.SecretFormatted}}</code>
  </p>

  <form method="post" action="/setup/2fa">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <label for="code">Aktueller Code aus der App</label>
    <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
           pattern="[0-9]{6}" maxlength="6" autofocus required placeholder="123456">
    <button type="submit">Bestätigen</button>
  </form>
</div>
{{template "footer" .}}{{end}}
