name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'

jobs:
  static:
    name: Statische Prüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sockets, pcntl, posix, mbstring, intl, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: composer.json prüfen
        run: composer validate --strict

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Der Agent hängt an nichts
        # Die Zusage aus §4.1: Was als root läuft, kommt ohne Composer aus.
        # Ein use-Statement auf einen vendor-Namensraum bricht sie — und weil
        # so etwas beim Lesen eines Diffs durchgeht, prüft es die CI.
        run: |
          if grep -rnE '^use (Illuminate|Symfony|Laravel|Inertia|Composer)\\' agent/src agent/bin; then
            echo "::error::Der Agent verweist auf eine Bibliothek der Anwendung."
            exit 1
          fi
          php -r 'require "agent/src/autoload.php";
                  new SrvPanel\Agent\Registry(new SrvPanel\Agent\Config());
                  if (class_exists("Composer\Autoload\ClassLoader", false)) { fwrite(STDERR, "vendor/ war geladen.\n"); exit(1); }
                  echo "Der Agent lädt ohne vendor/.\n";'

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sockets, pcntl, posix, mbstring, intl, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  ui:
    name: Oberfläche
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - name: Typen
        run: npm run types
      - name: Bundle
        run: npm run build

      - name: Farbwerte stehen nur in app.css
        # Vorgabe aus §7.2: Jede Farbe kommt aus den Marken. Ein Farbwert in
        # einer Komponente ist der Anfang vom Ende des zweiten Themes.
        #
        # Hier stand nur der Ausdruck für Hexwerte. Ein `rgb(0 0 0 / .5)` als
        # Schleier hinter der Navigationsschublade ging glatt durch — es ist
        # eine Farbe, sie stand in einer Komponente, und geprüft wurde etwas
        # anderes. Eine Regel, die eine Schreibweise prüft statt der Sache,
        # hält genau so lange, bis jemand die andere benutzt.
        run: |
          if grep -rnE '#[0-9a-fA-F]{3,8}\b|\b(rgba?|hsla?|oklch|color-mix)\(' \
              resources/js --include='*.vue' --include='*.ts'; then
            echo "::error::Farbwert außerhalb von app.css. Marke aus resources/css/app.css benutzen."
            exit 1
          fi
          echo "Keine Farbwerte außerhalb der Marken."

  integration:
    name: Installation auf ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Der Zweig, den es beim Vorgänger nicht gab — und der Grund, warum dort
    # eine systemd-Härtung jede Paketinstallation unmöglich machen konnte,
    # ohne dass ein Test es merkte. Hier läuft das gebaute Paket unter echtem
    # systemd auf jeder zugesagten Plattform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12
          - name: Debian 13
            image: debian:13
          - name: Ubuntu 22.04
            image: ubuntu:22.04
          - name: Ubuntu 24.04
            image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sockets, pcntl, posix, mbstring, intl, zip
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # **Erst in eine Datei, dann auspacken — und nicht in `tar` pipen.**
      # Dieser Schritt ist am 12. August 2026 zweimal an einem Tag ohne Zutun
      # des Codes gescheitert: einmal `curl: (56) Connection died`, einmal
      # `curl: (22) … error: 503`. Beide Male haben vier Geschwisterjobs
      # denselben Schritt in derselben Minute erfolgreich gefahren.
      #
      # Ein `--retry` an der Pipe wäre die falsche Reparatur: curl beginnt die
      # Übertragung neu, aber was schon durch die Pipe ist, hat `tar` gelesen —
      # der zweite Versuch schöbe Bytes hinterher, die nicht an diese Stelle
      # gehören. Das ist schlimmer als der Fehlschlag, weil es aussieht wie
      # Erfolg.
      #
      # > **Ein Wiederholversuch hinter einer Pipe wiederholt nur die Hälfte.**
      - name: nfpm bereitstellen
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "${RUNNER_TEMP}/nfpm.tar.gz" \
            https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz
          sudo tar -xzf "${RUNNER_TEMP}/nfpm.tar.gz" -C /usr/local/bin nfpm

      - name: Paket bauen
        run: packaging/build.sh 0.0.0-ci amd64

      # **Warum das Fenster so gross ist.** Gemessen im Lauf vom 4. August:
      #
      #     Fetched 31.9 MB in 2min 38s (202 kB/s)
      #
      # `apt-get update` allein verbrauchte 158 der damals 180 Sekunden, danach
      # kam die Installation gerade noch bis zur Paketliste. Kein Hänger, kein
      # Dialog — Ubuntus Paketquellen sind von den Läufern aus langsam, und die
      # Listen sind gross (allein `noble/universe` misst 19,3 MB).
      #
      # Debian war nie betroffen: `deb.debian.org` ist ein CDN. Deshalb war der
      # Fehler auch keine Flakiness, sondern zweimal Ubuntu und viermal Debian,
      # über drei Läufe hinweg gleich.
      #
      # **Der Spiegel bei Azure ist am 18. August 2026 wieder herausgenommen
      # worden, und diesmal auf Beleg.** Er stand hier ein Jahr lang auf
      # Verdacht: Die Läufer stehen bei Azure, und `azure.archive.ubuntu.com`
      # ist der Spiegel, den das Läufer-Abbild für sich selbst benutzt — das
      # klang nach der Kur. Die Messung gab das schon damals nicht her (138 s
      # auf 24.04, 255 s auf 22.04, gegenüber 158 s allein fürs Auffrischen
      # davor); grün wurde der Lauf durch das grössere Fenster.
      #
      # Was ihn jetzt herausnimmt, ist kein Zeitgewinn, sondern seine
      # Verfügbarkeit. Drei Ausfälle:
      #
      # | wann | was |
      # |---|---|
      # | 11. August | das Fenster gerissen, im Herunterladen stehend |
      # | 18. August, mittags | Download blieb bei `libicu70` stehen |
      # | 18. August, abends | `Unable to connect … [IP: 52.161.185.214 80]`, apt endet mit 100 |
      #
      # **Und `Acquire::Retries "3"` hat den dritten nicht gerettet** — derselbe
      # Fehlschlag mit drei Wiederholungen, weil der Rechner nicht langsam ist,
      # sondern jede Verbindung ablehnt.
      #
      # > **Ein Spiegel ist ein Rechner. Der Vorgabename ist eine Liste.**
      #
      # `archive.ubuntu.com` löst auf einen wechselnden Satz Adressen auf; ein
      # ausgefallener Rechner darin kostet einen Versuch und nicht den Lauf.
      # Debian war nie betroffen, weil `deb.debian.org` genau das schon ist.
      #
      # **Und am 11. August ist genau dieses Fenster gerissen** — auf 22.04, im
      # Herunterladen stehend, beim einunddreissigsten von einunddreissig
      # Paketen. Die Messung von oben sagt, warum das kommen musste: 255 s
      # gemessen gegen 300 s erlaubt, also fünfzehn Prozent Luft gegen eine
      # Quelle, deren Durchsatz zwischen 200 kB/s und mehr schwankt. Ein
      # Fehlschlag war da keine Frage des Ob.
      #
      # Das Fenster steht deshalb jetzt auf 600 s, und der Schritt **misst
      # mit**: Kommt systemd, schreibt er in den Lauf, nach wie vielen
      # Sekunden. Damit muss die nächste Fassung dieses Fensters nicht wieder
      # aus einem Fehlschlag geschätzt werden — die Zahl steht in jedem grünen
      # Lauf.
      #
      # > **Ein Grenzwert, dessen Abstand zur Messung niemand kennt, ist ein
      # > Fehlschlag mit Verzögerung.**
      # **Der Spiegel fällt aus, und apt versucht es genau einmal.** Am
      # 18. August 2026 zweimal an einem Tag: mittags blieb der Download bei
      # `libicu70` stehen, abends nahm `azure.archive.ubuntu.com` gar keine
      # Verbindung mehr an (`Unable to connect … [IP: 52.161.185.214 80]`) und
      # `apt-get` endete mit 100. Zusammen mit dem gerissenen Fenster vom
      # 11. August ist das der dritte Ausfall derselben Quelle.
      #
      # `Acquire::Retries` steht deshalb als apt-Konfiguration **im Container**
      # und nicht als `-o` am Aufruf: Der Aufruf, der scheitert, ist der des
      # Installers (`nftables`, `fail2ban`, `mariadb-server`), und den schreibt
      # dieser Workflow nicht.
      #
      # **Was sie nicht behebt, und das ist zweimal gemessen:** eine Verbindung,
      # die noch tröpfelt (dagegen schlägt apts Zeitgrenze nie zu — der Fehler
      # vom Mittag), und einen Rechner, der jede Verbindung ablehnt (dagegen
      # wiederholt man dreimal dasselbe Nein — der Fehler vom Abend).
      #
      # > **Eine Wiederholung heilt eine abgewiesene Verbindung nicht, wenn sie
      # > jedes Mal abgewiesen wird.**
      #
      # Genau dieser Lauf hat den Spiegel oben herausgenommen: Die Wiederholung
      # allein reichte nicht, und damit war belegt, was vorher Verdacht war.
      # Sie bleibt trotzdem stehen — sie kostet nichts und fängt den einzelnen
      # ausgefallenen Rechner ab, den `archive.ubuntu.com` nun auch enthalten
      # kann.
      - name: Container mit systemd starten
        run: |
          docker run -d --name target --privileged \
            --tmpfs /run --tmpfs /run/lock -v /sys/fs/cgroup:/sys/fs/cgroup:rw --cgroupns=host \
            -v "${PWD}/dist:/packages:ro" \
            ${{ matrix.image }} /bin/sh -c \
            'export DEBIAN_FRONTEND=noninteractive; set -x; printf "Acquire::Retries \"3\";\n" > /etc/apt/apt.conf.d/80-retries; apt-get update && apt-get install -y systemd systemd-sysv && exec /sbin/init'
          # **Ohne die Prüfung danach endet ein Zeitüberschreiten stumm.** Die
          # Schleife lief ab, der Schritt galt als geglückt — das `| head -1`
          # gab den Rückgabewert von `head` zurück und nicht den von `docker
          # exec` —, und gescheitert ist der Lauf drei Schritte später an einer
          # dpkg-Sperre. Eine Meldung, die mit der Ursache nichts zu tun hat.
          #
          # Fenster und Meldung kommen aus derselben Zahl. Standen sie
          # getrennt da, sagte die Meldung „in 300 s" für ein Fenster, das
          # längst anders war — und wer sie liest, sucht den Fehler bei der
          # falschen Dauer.
          versuche=300
          bereit=nein
          for i in $(seq 1 "$versuche"); do
            if docker exec target systemctl is-system-running 2>/dev/null | grep -qE 'running|degraded'; then
              bereit=ja
              echo "::notice::systemd war nach $((i * 2)) s da (Fenster: $((versuche * 2)) s)."
              break
            fi
            sleep 2
          done

          if [ "$bereit" != ja ]; then
            echo "::error::systemd im Container ist in $((versuche * 2)) s nicht hochgekommen."

            # **Zustand vor Ausgabe.** Beim ersten Fehlschlag stand hier nur
            # `docker logs`, und das gab nichts aus — womit offen blieb, ob der
            # Container noch läuft, schon beendet ist oder nie etwas geschrieben
            # hat. Drei sehr verschiedene Lagen, eine leere Zeile.
            echo "--- Zustand ---"
            docker ps -a --filter "name=target" --format '{{.Status}} (exit {{.State}})' || true
            echo "--- Ausgabe ---"
            docker logs target 2>&1 | tail -50 || echo "(docker logs hat nichts geliefert)"
            exit 1
          fi

          docker exec target systemctl --version

      - name: PHP-Quelle und PHP 8.4
        # Denselben Weg geht install.sh. Von den vier Zielplattformen liefert nur
        # Debian 13 PHP 8.4 aus eigenen Quellen — Laravel 13 verlangt es.
        run: |
          # Über die Standardeingabe statt über docker cp: systemd hängt beim
          # Booten ein tmpfs über /tmp, und docker cp schreibt in den darunter
          # liegenden Baum — die Datei ist im Container dann unsichtbar.
          docker exec -i target sh -s < packaging/php-source.sh
          docker exec target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            php8.4-cli php8.4-fpm php8.4-mbstring php8.4-xml php8.4-curl php8.4-mysql curl'
          docker exec target php8.4 --version

      # Das Verzeichnis der Fassung muss die Fassung im Namen tragen.
      #
      # In jedem bisher gebauten Paket hiess es woertlich
      # /opt/srvpanel/releases/${VERSION} — nfpm setzt Umgebungsvariablen in
      # `version:` ein, aber nicht in Pfaden unter `contents:`. Eine
      # Neuinstallation lief damit tadellos, weil auch der Symlink dieselbe
      # Zeichenkette trug. Kaputt war das Update, und das faellt bei einer
      # Erstinstallation nie auf.
      - name: Das Verzeichnis der Fassung traegt die Fassung
        run: |
          listing="$(dpkg-deb -c dist/srvpanel_*.deb | grep -oE '/opt/srvpanel/releases/[^/]+' | head -1)"
          echo "Verzeichnis: ${listing}"
          case "${listing}" in
            */releases/0.0.0-ci) echo "richtig benannt." ;;
            *) echo "::error::Das Paket legt die Fassung nach ${listing} - erwartet war /opt/srvpanel/releases/0.0.0-ci"; exit 1 ;;
          esac

      - name: Paket installieren
        run: |
          docker exec target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/*.deb'

      - name: Der Agent läuft und antwortet
        run: |
          docker exec target systemctl is-active srvpanel-agentd.service
          docker exec target /opt/srvpanel/current/agent/bin/srvpanel-agentd call agent.ping
          docker exec target /opt/srvpanel/current/agent/bin/srvpanel-agentd call system.info | head -5

      # Die Anmeldung hängt daran (§6.4). Ob das ausgelieferte PHP Argon2id
      # kann, ist keine Frage der Konfiguration, sondern des Übersetzens —
      # und damit eine Eigenschaft der Plattform, nicht des Projekts. Fehlt
      # es, scheitert nicht die Anmeldung, sondern schon das Anlegen des
      # ersten Adminkontos; das soll hier auffallen und nicht dort.
      - name: PHP kann Argon2id
        run: |
          docker exec target /opt/srvpanel/bin/php -r '
            if (! defined("PASSWORD_ARGON2ID")) { fwrite(STDERR, "PASSWORD_ARGON2ID fehlt\n"); exit(1); }
            $h = password_hash("probe", PASSWORD_ARGON2ID, ["memory_cost" => 65536, "time_cost" => 4, "threads" => 1]);
            if (! is_string($h) || ! str_starts_with($h, "$argon2id$")) { fwrite(STDERR, "kein argon2id-Hash\n"); exit(1); }
            if (! password_verify("probe", $h)) { fwrite(STDERR, "Prüfung schlug fehl\n"); exit(1); }
            echo "argon2id: ", substr($h, 0, 30), "\n";
          '

      - name: Der Socket ist nicht für alle offen
        run: |
          mode="$(docker exec target stat -c '%a %U:%G' /run/srvpanel/agent.sock)"
          echo "Socket: ${mode}"
          case "${mode}" in
            "660 root:srvpanel") ;;
            *) echo "::error::Socket steht auf ${mode}, erwartet ist 660 root:srvpanel"; exit 1 ;;
          esac

      # **Die Fassungsspanne, gemessen statt vermutet** (`docs/38 §2.3`, A1–A4).
      #
      # Sie stand seit P5b als offener Punkt da: Gemessen war PostgreSQL nur auf
      # Ubuntu 24.04 und im Entwicklungscontainer. Für Debian 12, Debian 13 und
      # Ubuntu 22.04 war die Zahl unbekannt — und die für uns wichtigste Regel
      # hat sich mit PG 15 geändert: Bis PG 14 darf PUBLIC im Schema `public`
      # jeder Datenbank Objekte anlegen.
      #
      # **Der Bau ist davon unabhängig**, denn `Pg\Shielding` widerruft
      # ausdrücklich statt sich auf die Vorgabe zu verlassen. Was fehlte, war der
      # Beleg. Er steht jetzt hier und nicht in einem Protokoll, das jemand
      # einmal geschrieben hat:
      #
      #   Eine Messung, die einmal jemand von Hand macht, ist ein Datum.
      #   Eine, die die CI macht, ist eine Zusage.
      - name: PostgreSQL — Fassung und Abschottung
        run: |
          set -e

          docker exec target sh -c \
            'DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql >/dev/null'
          docker exec target pg_lsclusters
          docker exec target dpkg-query -W -f='Metapaket postgresql: ${Version}\n' postgresql

          # **Ein installiertes Paket ist kein laufender Dienst.** Nach
          # `apt-get install postgresql` stand der Cluster auf allen vier
          # Plattformen auf `down`, und der erste `psql` scheiterte am
          # fehlenden Socket. Auf einem Zielserver startet das Paket den
          # Cluster mit; in diesem Container tut es das nicht.
          #
          # Gestartet wird er deshalb hier — und **gemessen wird die
          # Bereitschaft und nicht der Rückgabewert von `systemctl`.** Der
          # sagt, dass die Unit angenommen wurde, nicht dass jemand auf dem
          # Socket antwortet. Derselbe Unterschied wie bei der Quota in
          # `docs/41`: Eine Option, die etwas erlaubt, ist nicht dasselbe wie
          # ein Zustand, in dem es geschieht.
          docker exec target systemctl start postgresql || true

          bereit=nein
          for i in $(seq 1 60); do
            if docker exec target pg_isready -q; then
              bereit=ja
              echo "::notice::PostgreSQL war nach $((i * 2)) s bereit."
              break
            fi
            sleep 2
          done

          if [ "$bereit" != ja ]; then
            echo "::error::PostgreSQL im Container nimmt keine Verbindungen an."
            # Zustand vor Ausgabe, wie beim Warten auf systemd: drei sehr
            # verschiedene Lagen sähen sonst gleich aus.
            docker exec target pg_lsclusters || true
            docker exec target systemctl --no-pager status 'postgresql*' || true
            docker exec target sh -c 'tail -40 /var/log/postgresql/*.log' || true
            exit 1
          fi

          # **Die Grenze kommt aus dem Quelltext und nicht aus dieser Datei.**
          # Eine Zahl hier wäre die zweite Fassung derselben Regel, und die
          # zweite ist die, die veraltet.
          grenze="$(docker exec target /opt/srvpanel/bin/php -r \
            'require "/opt/srvpanel/current/agent/src/autoload.php"; echo SrvPanel\Agent\Pg\Server::MIN_VERSION;')"
          num="$(docker exec target su postgres -s /bin/sh -c "psql -XAtc 'SHOW server_version_num'")"
          haupt="$((num / 10000))"

          paket="$(docker exec target dpkg-query -W -f='${Version}' postgresql)"

          echo "${{ matrix.name }}: PostgreSQL ${haupt} (${num}), Grenze des Panels: ${grenze}"

          # **Die Zahl gehört auf die Übersicht des Laufs und nicht nur ins
          # Protokoll.** Beim ersten grünen Lauf standen alle vier Messungen da
          # — und um sie zu lesen, musste man vier Protokolle einzeln aufmachen
          # und in jedem ein paar hundert Zeilen weit zurückblättern. Eine
          # Messung, die niemand findet, ist so gut wie keine.
          #
          # Jeder Job der Reihe schreibt seine eigene Übersicht; eine
          # gemeinsame Tabelle gibt es nicht, weil `GITHUB_STEP_SUMMARY` je
          # Job existiert. Deshalb trägt jede Zeile ihre Kopfzeile mit.
          {
            echo "### PostgreSQL auf ${{ matrix.name }}"
            echo
            echo "| Metapaket | Fassung | Grenze des Panels | Abschottung |"
            echo "|---|---|---|---|"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${haupt}" -lt "${grenze}" ]; then
            # Kein Fehlschlag: Das Panel weist diese Fassung ab, und genau das
            # ist die richtige Antwort. Gesagt wird es trotzdem — ein Lauf, der
            # Punkte auslässt, ohne es zu sagen, sieht aus wie ein vollständiger.
            echo "::notice::${{ matrix.name }} liefert PostgreSQL ${haupt}, unter der Grenze ${grenze}."
            echo "::notice::Die Abschottung wird hier nicht gefahren — das Panel bietet die Fläche gar nicht an."
            echo "| \`${paket}\` | ${haupt} (${num}) | ${grenze} | übersprungen — unter der Grenze |" \
              >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          docker exec target su postgres -s /bin/sh -c "psql -v ON_ERROR_STOP=1 -q -c 'CREATE ROLE fremd NOLOGIN'"
          docker exec target su postgres -s /bin/sh -c "psql -v ON_ERROR_STOP=1 -q -c 'CREATE DATABASE pruef'"

          # **Erst die Lage von vor PG 15 herstellen.** Ab PG 15 ist der Widerruf
          # die Vorgabe; ohne diese Zeile prüfte der Test auf den neuen
          # Plattformen die Vorgabe und nicht die Absperrung.
          docker exec target su postgres -s /bin/sh -c \
            "psql -v ON_ERROR_STOP=1 -q -d pruef -c 'GRANT ALL ON SCHEMA public TO PUBLIC'"

          # **Die Untergrenze: jetzt MUSS es gehen.** Ohne sie bestünde der Test
          # auch dann, wenn `fremd` aus einem ganz anderen Grund nichts anlegen
          # kann — und niemand wüsste es.
          docker exec -i target su postgres -s /bin/sh -c 'psql -v ON_ERROR_STOP=1 -q -d pruef -f -' <<'SQL'
          SET ROLE fremd;
          CREATE TABLE offen (i int);
          SQL
          echo "Untergrenze: PUBLIC durfte anlegen, wie vor PG 15."

          # Die Absperrung kommt aus dem Quelltext — dieselbe Zeichenkette, die
          # der Agent beim Anlegen einer Kundendatenbank ausführt.
          docker exec target /opt/srvpanel/bin/php -r \
            'require "/opt/srvpanel/current/agent/src/autoload.php";
             foreach (SrvPanel\Agent\Pg\Shielding::statements("pruef", []) as $sql) { echo $sql, ";\n"; }' \
            > sperre.sql
          cat sperre.sql
          docker exec -i target su postgres -s /bin/sh -c 'psql -v ON_ERROR_STOP=1 -q -d pruef -f -' < sperre.sql

          if docker exec -i target su postgres -s /bin/sh -c 'psql -v ON_ERROR_STOP=1 -q -d pruef -f -' <<'SQL'
          SET ROLE fremd;
          CREATE TABLE verboten (i int);
          SQL
          then
            echo "::error::Nach der Absperrung darf PUBLIC im Schema public immer noch anlegen (PostgreSQL ${haupt})."
            exit 1
          fi
          echo "Abschottung: PUBLIC darf im Schema public nicht mehr anlegen."

          # Und die Liste der Katalogsichten ist fassungsabhängig — sie wird
          # erfragt und nicht verdrahtet (`docs/38 §10`). Zu messen ist, dass die
          # Abfrage auf dieser Fassung etwas findet.
          docker exec target /opt/srvpanel/bin/php -r \
            'require "/opt/srvpanel/current/agent/src/autoload.php"; echo SrvPanel\Agent\Pg\Shielding::DISCOVERY;' \
            > sichten.sql
          # `|| true`, damit `set -e` nicht vor der Meldung zuschlägt: `grep -c`
          # gibt bei null Treffern 1 zurück, und genau dann soll unten etwas
          # Lesbares stehen statt eines abgebrochenen Schritts.
          anzahl="$(docker exec -i target su postgres -s /bin/sh -c 'psql -XAt -d pruef -f -' < sichten.sql | grep -c . || true)"
          echo "Katalogsichten mit einem Datenbanknamen: ${anzahl}"

          if [ "${anzahl}" -lt 1 ]; then
            echo "::error::Die Abfrage der Katalogsichten findet auf PostgreSQL ${haupt} nichts."
            exit 1
          fi

          echo "| \`${paket}\` | ${haupt} (${num}) | ${grenze} | gefahren, ${anzahl} Katalogsichten |" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Ersteinrichtung und Oberfläche
        run: |
          docker exec target sh -c 'systemctl start mariadb || service mariadb start' || true
          sleep 5
          docker exec target srvpanel setup --port=8443
          docker exec target curl -fsS -k https://127.0.0.1:8443/health
          echo

      # **Der Neustart des Agenten ist der Griff, der zweimal etwas umgeworfen
      # hat** (`docs/67`, Befunde 1 und 4) — und beide Male hat es kein Lauf
      # gemeldet, weil dieser Schritt fehlte.
      #
      # Befund 1: `StateDirectory=` in der Unit des Agenten zog `/var/lib/srvpanel`
      # bei jedem Start auf `0755` zurück, gegen fünf Stellen, die `0750
      # srvpanel:srvpanel` sagen. Befund 4: `/run/srvpanel` ist das
      # `RuntimeDirectory` derselben Unit, und darin liegt auch `fpm.sock` —
      # beim Stoppen nahm systemd ihn mit, nginx antwortete mit 502, und beide
      # Dienste meldeten dabei `active`.
      #
      # > **Ein Dienst, der sich neu starten lässt, muss sich neu starten
      # > lassen, ohne einen anderen mitzunehmen.**
      - name: Ein Neustart des Agenten nimmt nichts mit
        run: |
          docker exec target systemctl restart srvpanel-agentd.service

          # **Warten statt rennen** (`docs/67`, Befund 5). Die Unit ist
          # `Type=simple`: `systemctl restart` kehrt zurück, sobald der Prozess
          # *läuft* — nicht, wenn er seinen Socket gebunden hat. Dazwischen
          # liegen ein PHP-Start, das Lesen der Konfiguration, `unlink` und
          # `bind`. Wer sofort misst, misst den Start und nicht das Ergebnis;
          # auf `cloudsrv24` fehlte `agent.sock` genau deshalb, und zwei
          # Sekunden später war er da.
          #
          # > **Eine Prüfung, die vom Zeitpunkt abhängt, ist beim nächsten Lauf
          # > eine andere.**
          #
          # Die Frist macht daraus keine Geduldsprobe: Bindet der Agent nach
          # 30 Sekunden nicht, ist das ein Fehlschlag und kein langsamer Start.
          bereit=0
          for _ in $(seq 1 30); do
            if docker exec target test -S /run/srvpanel/agent.sock; then
              bereit=1
              break
            fi
            sleep 1
          done

          if [ "${bereit}" != 1 ]; then
            echo "::error::Der Agent hat seinen Socket nach 30 s nicht gebunden."
            docker exec target journalctl -u srvpanel-agentd --no-pager | tail -n 30
            exit 1
          fi

          docker exec target systemctl is-active srvpanel-agentd.service

          # Der Socket von PHP-FPM muss den Neustart überlebt haben — er liegt
          # im selben Verzeichnis und gehört einem anderen Dienst.
          docker exec target test -S /run/srvpanel/fpm.sock

          rechte="$(docker exec target stat -c '%a %U:%G' /var/lib/srvpanel)"
          if [ "${rechte}" != "750 srvpanel:srvpanel" ]; then
            echo "::error::Nach dem Neustart steht /var/lib/srvpanel auf ${rechte} — eine Unit nimmt das Verzeichnis für sich in Anspruch."
            exit 1
          fi
          echo "Rechte gehalten: ${rechte}"

          # Der eigentliche Beleg: Die Oberfläche antwortet **danach** noch.
          # Ohne diese Zeile sähe ein weggeräumter fpm.sock aus wie Erfolg.
          docker exec target curl -fsS -k https://127.0.0.1:8443/health
          echo

      - name: Ein zweiter Lauf der Ersteinrichtung ändert nichts
        # Wiederholbarkeit ist keine Kür: Wer nach einem Fehlschlag noch einmal
        # einrichtet, darf dabei nicht den Schlüssel wechseln — sonst ist die
        # Datenbank danach unlesbar.
        run: |
          vorher="$(docker exec target grep '^APP_KEY=' /etc/srvpanel/panel.env)"
          docker exec target srvpanel setup --port=8443 >/dev/null
          nachher="$(docker exec target grep '^APP_KEY=' /etc/srvpanel/panel.env)"
          [ "$vorher" = "$nachher" ] || { echo "::error::Der APP_KEY hat sich beim zweiten Lauf geändert."; exit 1; }
          echo "Der Schlüssel ist geblieben."

      - name: Entfernen hinterlässt keine Dienste, aber die Daten
        run: |
          docker exec target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get remove -y srvpanel'
          ! docker exec target systemctl is-active srvpanel-agentd.service
          docker exec target test -d /var/lib/srvpanel

      # In diesem Container hat der Schritt „PHP-Quelle und PHP 8.4" die
      # Quelldatei angelegt, bevor srvpanel-php-source überhaupt installiert
      # wurde. Sie gehört dem Paket also nicht, und ein purge darf sie nicht
      # mitnehmen: Zurück bliebe sonst ein System mit installiertem PHP 8.4,
      # für das es keine Sicherheitsupdates mehr gibt — unbemerkt, denn nichts
      # daran sieht kaputt aus.
      - name: Ein purge nimmt keine fremde PHP-Quelle mit
        run: |
          # Als if und nicht als `test … && var=ja`: Der Lauf steht unter
          # `bash -e`, und der Rückgabewert einer UND-Liste ist der des
          # fehlgeschlagenen Tests — der Schritt bräche ab, sobald die Datei
          # fehlt, also genau auf Debian 13.
          before=nein
          if docker exec target test -f /etc/apt/sources.list.d/php-sury.sources; then before=ja; fi
          echo "Quelle vor dem purge vorhanden: ${before}"

          docker exec target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get purge -y srvpanel-php-source'

          after=nein
          if docker exec target test -f /etc/apt/sources.list.d/php-sury.sources; then after=ja; fi

          if [ "${before}" != "${after}" ]; then
            echo "::error::purge hat die PHP-Quelle entfernt, obwohl das Paket sie nicht angelegt hat"
            exit 1
          fi
          echo "Quelle nach dem purge vorhanden: ${after} — unverändert."

      # Der Weg, den jeder Bestandskunde geht — und der bis heute von nichts
      # geprüft wurde. Eine Erstinstallation sagt darüber nichts: Sie hat
      # keine vorige Fassung, die sie danebenlegen oder auf die sie
      # zurückfallen könnte.
      - name: Ein Update legt die neue Fassung neben die alte
        run: |
          # Erst den Zustand von vorher wiederherstellen — der Schritt oben
          # hat srvpanel entfernt.
          docker exec target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/srvpanel_*.deb'
          alt="$(docker exec target readlink -f /opt/srvpanel/current)"
          echo "vorher: ${alt}"

          # Eine Spur im Schreibbereich hinterlassen. Sie muss das Update
          # überleben — bis rc.5 lag storage in der Fassung, und weil das
          # Verzeichnis wörtlich ${VERSION} hiess und sich nie änderte, fiel
          # das nicht auf. Ab P2 stünden dort Sicherungen und Kundendateien.
          docker exec target sh -c 'echo unverwechselbar-4711 > /opt/srvpanel/current/storage/app/private/probe.txt'

          # Eine zweite, höhere Fassung bauen und einspielen. Die Ausgabe wird
          # aufgehoben: Was die Paketskripte sagen, ist der einzige Beleg für
          # den Rückweg, denn er ist nach dem Update absichtlich wieder weg.
          packaging/build.sh 0.0.1-ci amd64 >/dev/null
          docker exec target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/srvpanel_0.0.1*.deb' \
            | tee update.txt

          neu="$(docker exec target readlink -f /opt/srvpanel/current)"
          echo "nachher: ${neu}"

          if [ "${alt}" = "${neu}" ]; then
            echo "::error::Beide Fassungen liegen im selben Verzeichnis (${neu}). Der Rückweg kann dann nie greifen."
            exit 1
          fi

          # Der Rückweg ist nach dem Update nicht mehr zu sehen — er wird nach
          # bestandener Bereitschaftsprüfung abgeräumt, und das ist richtig so.
          # Belegen lässt er sich über die Ausgabe der Paketskripte, die apt
          # durchreicht: bereitgestellt vor dem Entpacken, abgeräumt danach.
          grep -q 'Rückweg bereitgestellt' update.txt \
            || { echo "::error::Kein Rückweg bereitgestellt. dpkg entfernt die vorige Fassung beim Entpacken — ohne Kopie ist sie weg."; cat update.txt; exit 1; }

          grep -q 'Rückweg nicht mehr nötig' update.txt \
            || { echo "::error::Der Rückweg wurde nicht abgeräumt — er hielte sonst dauerhaft eine Fassung Plattenplatz."; cat update.txt; exit 1; }

          docker exec target sh -c '! test -d /opt/srvpanel/rollback' \
            || { echo "::error::/opt/srvpanel/rollback steht noch da."; exit 1; }

          # Der Schreibbereich hat das Update überlebt.
          docker exec target grep -q unverwechselbar-4711 /opt/srvpanel/current/storage/app/private/probe.txt \
            || { echo "::error::Der Schreibbereich ist beim Update verlorengegangen. Ab P2 wären das Sicherungen und Kundendateien."; exit 1; }

          # Und die alte Fassung ist restlos weg. dpkg räumt nur seine eigenen
          # Dateien ab; was zur Laufzeit entstanden ist, hielt bis rc.5 das
          # Verzeichnis am Leben — sichtbar als fünf „Directory not empty" beim
          # ersten echten Update auf einem Server. Ohne diese Prüfung sammelt
          # sich unter releases/ nach jedem Update ein weiteres Gerippe.
          uebrig="$(docker exec target sh -c 'ls -1 /opt/srvpanel/releases')"
          if [ "$(echo "${uebrig}" | wc -l)" -ne 1 ]; then
            echo "::error::Unter /opt/srvpanel/releases stehen noch Reste:"
            echo "${uebrig}"
            docker exec target sh -c 'find /opt/srvpanel/releases -mindepth 1 -maxdepth 3 | head -50'
            exit 1
          fi
          echo "releases/ enthält nur noch: ${uebrig}"

          # Als `grep … && { … }` geschrieben wäre dieser Schritt immer dann
          # fehlgeschlagen, wenn er nichts findet: Der Lauf steht unter
          # `set -e`, und ein erfolgloses grep beendet die Verkettung mit 1.
          if grep -q 'Directory not empty' update.txt; then
            echo "::error::dpkg konnte Verzeichnisse der alten Fassung nicht löschen."
            cat update.txt
            exit 1
          fi

          docker exec target curl -fsS -k https://127.0.0.1:8443/health >/dev/null
          echo "Update durchgelaufen, Rückweg bereitgestellt und abgeräumt, Schreibbereich erhalten, Panel antwortet."

      - name: Aufräumen
        if: always()
        run: docker rm -f target || true

  # Die Abhängigkeiten eines Pakets kann man nur prüfen, indem man es allein
  # installiert.
  #
  # Der Job oben spielt PHP samt Erweiterungen vorher ein — denselben Weg geht
  # install.sh, und deshalb war dort nie zu sehen, dass das Paket `php8.4-mysql`
  # nicht als Abhängigkeit führte. Wer `apt install srvpanel` tippte, bekam ein
  # Panel ohne Datenbanktreiber; die Ersteinrichtung starb bei den Migrationen
  # mit „could not find driver". Gefunden hat das kein Test, sondern der erste
  # Mensch, der es auf einem eigenen Server versucht hat.
  #
  # Hier wird deshalb ausschließlich das Paket installiert, und apt muss alles
  # Weitere selbst herbeischaffen.
  bare-install:
    name: Nur das Paket auf ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 13 hat PHP 8.4 im Bestand: hier genügt `apt install srvpanel`
          # tatsächlich allein.
          - name: Debian 13
            image: debian:13
            needs_php_source: 'nein'
          # Debian 12 braucht vorher srvpanel-php-source — das ist die
          # dokumentierte Voraussetzung, und mehr darf es nicht sein.
          - name: Debian 12
            image: debian:12
            needs_php_source: 'ja'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sockets, pcntl, posix, mbstring, intl, zip
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # **Erst in eine Datei, dann auspacken — und nicht in `tar` pipen.**
      # Dieser Schritt ist am 12. August 2026 zweimal an einem Tag ohne Zutun
      # des Codes gescheitert: einmal `curl: (56) Connection died`, einmal
      # `curl: (22) … error: 503`. Beide Male haben vier Geschwisterjobs
      # denselben Schritt in derselben Minute erfolgreich gefahren.
      #
      # Ein `--retry` an der Pipe wäre die falsche Reparatur: curl beginnt die
      # Übertragung neu, aber was schon durch die Pipe ist, hat `tar` gelesen —
      # der zweite Versuch schöbe Bytes hinterher, die nicht an diese Stelle
      # gehören. Das ist schlimmer als der Fehlschlag, weil es aussieht wie
      # Erfolg.
      #
      # > **Ein Wiederholversuch hinter einer Pipe wiederholt nur die Hälfte.**
      - name: nfpm bereitstellen
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "${RUNNER_TEMP}/nfpm.tar.gz" \
            https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz
          sudo tar -xzf "${RUNNER_TEMP}/nfpm.tar.gz" -C /usr/local/bin nfpm

      - name: Paket bauen
        run: packaging/build.sh 0.0.0-ci amd64

      - name: Container mit systemd starten
        run: |
          docker run -d --name bare --privileged \
            --tmpfs /run --tmpfs /run/lock -v /sys/fs/cgroup:/sys/fs/cgroup:rw --cgroupns=host \
            -v "${PWD}/dist:/packages:ro" \
            ${{ matrix.image }} /bin/sh -c \
            'export DEBIAN_FRONTEND=noninteractive; set -x; printf "Acquire::Retries \"3\";\n" > /etc/apt/apt.conf.d/80-retries; apt-get update && apt-get install -y systemd systemd-sysv && exec /sbin/init'
          # Dieselbe Prüfung wie oben, und hier fehlte sie ganz: Ein
          # Zeitüberschreiten war vollständig unsichtbar. Dasselbe Fenster und
          # dieselbe Messung wie dort — die Begründung steht beim ersten Lauf.
          versuche=300
          bereit=nein
          for i in $(seq 1 "$versuche"); do
            if docker exec bare systemctl is-system-running 2>/dev/null | grep -qE 'running|degraded'; then
              bereit=ja
              echo "::notice::systemd war nach $((i * 2)) s da (Fenster: $((versuche * 2)) s)."
              break
            fi
            sleep 2
          done

          if [ "$bereit" != ja ]; then
            echo "::error::systemd im Container ist in $((versuche * 2)) s nicht hochgekommen."

            # **Zustand vor Ausgabe.** Beim ersten Fehlschlag stand hier nur
            # `docker logs`, und das gab nichts aus — womit offen blieb, ob der
            # Container noch läuft, schon beendet ist oder nie etwas geschrieben
            # hat. Drei sehr verschiedene Lagen, eine leere Zeile.
            echo "--- Zustand ---"
            docker ps -a --filter "name=bare" --format '{{.Status}} (exit {{.State}})' || true
            echo "--- Ausgabe ---"
            docker logs bare 2>&1 | tail -50 || echo "(docker logs hat nichts geliefert)"
            exit 1
          fi

      - name: PHP-Quelle — nur wo sie Voraussetzung ist
        if: matrix.needs_php_source == 'ja'
        run: |
          docker exec bare sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /packages/srvpanel-php-source_*.deb'
          docker exec bare sh -c 'apt-get update -qq'

      - name: Nur das Paket, sonst nichts
        run: |
          # Kein php8.4-* auf der Kommandozeile, keine Erweiterungen von Hand:
          # Was fehlt, muss apt aus den Abhängigkeiten des Pakets ableiten.
          docker exec bare sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/srvpanel_*.deb'

      - name: Der Datenbanktreiber ist da
        run: |
          # Die eine Zeile, die im Juli gefehlt hat.
          docker exec bare /opt/srvpanel/bin/php -r '
            if (! extension_loaded("pdo_mysql")) { fwrite(STDERR, "pdo_mysql fehlt\n"); exit(1); }
            echo "pdo_mysql: da\n";
          '
          for ext in mbstring dom curl openssl tokenizer sockets posix pcntl; do
            docker exec bare /opt/srvpanel/bin/php -r "
              if (! extension_loaded('$ext')) { fwrite(STDERR, \"$ext fehlt\n\"); exit(1); }
            " || exit 1
            echo "$ext: da"
          done

      - name: Die Ersteinrichtung läuft durch
        run: |
          docker exec bare sh -c 'systemctl start mariadb || service mariadb start' || true
          sleep 5
          # --no-ansi: Ohne TTY schaltet Symfony die Einfärbung zwar von
          # selbst ab, aber der Test unten liest diese Datei — und eine
          # Prüfung, die von einer Vermutung über das Terminal abhängt, ist
          # keine.
          docker exec bare srvpanel setup --port=8443 --no-ansi | tee setup.txt
          docker exec bare curl -fsS -k https://127.0.0.1:8443/health
          echo

      # Was die Einrichtung sagt, ist das Einzige, was der Betreiber danach
      # hat. Genau hier fehlte eine Prüfung: Der Schlusssatz „Anmeldung und
      # Konten kommen mit der Ausbaustufe P1" war seit P1 falsch und stand ein
      # halbes Jahr da — wer ihn las, hörte auf, nach einem Adminkonto zu
      # suchen. Gefunden hat ihn kein Lauf, sondern der erste Mensch, der die
      # Einrichtung durchlaufen liess.
      - name: Die Einrichtung sagt, wie es weitergeht
        run: |
          echo "── Ausgabe ──"; cat setup.txt; echo "─────────────"

          # 1. Die Adresse muss aufloesbar sein. Ein blosser Rechnername ohne
          #    Punkt ist es ausserhalb des Rechners nicht — genau das stand
          #    dort: https://cloudsrv24:8443/
          #
          #    Geprueft wird auf einen Punkt. Das deckt beides ab, den
          #    vollstaendigen Namen und die IP-Adresse, und ist die Eigenschaft,
          #    an der es tatsaechlich lag.
          url="$(grep -oE 'https://[^ /]+' setup.txt | head -1 | sed 's#https://##')"
          echo "Adresse: ${url}"
          if ! echo "${url}" | grep -q '\.'; then
            echo "::error::Die Einrichtung nennt ${url} - kein Punkt darin, also von aussen nicht aufloesbar."
            exit 1
          fi

          # 2. Ohne Adminkonto muss der Befehl dastehen, mit dem man eines
          #    anlegt. Ohne ihn kommt niemand in ein frisch eingerichtetes
          #    Panel hinein.
          grep -q 'srvpanel admin' setup.txt \
            || { echo "::error::Kein Hinweis auf srvpanel admin, obwohl es kein Adminkonto gibt."; exit 1; }

          # 3. Und der alte Satz darf nicht zurückkommen.
          if grep -qi 'Ausbaustufe P1' setup.txt; then
            echo "::error::Der Satz über die Ausbaustufe P1 ist wieder da — er war seit P1 falsch."
            exit 1
          fi
          echo "Adresse auflösbar, Hinweis vorhanden, alter Satz weg."

      - name: Mit Adminkonto sagt sie etwas anderes
        run: |
          # Der zweite Zweig. Ein Test, der nur den Fall ohne Konto prüft,
          # bliebe grün, wenn der Hinweis unbedingt erschiene — und dann
          # stünde er auch auf Servern, die längst eingerichtet sind.
          # Die Ausgabe geht in eine Datei und nicht nach /dev/null: Beim
          # ersten Lauf scheiterte genau dieser Aufruf — der Wrapper kannte
          # `admin` nicht — und die Umleitung hat die Begründung verschluckt.
          # Ein Schritt, der stumm mit 1 endet, kostet einen ganzen Durchlauf.
          #
          # Beim Ausgeben fliegt die Zeile mit dem Passwort raus. Es gilt für
          # ein erfundenes Konto in einem Wegwerf-Container, aber ein Passwort
          # in einem öffentlichen Protokoll gewöhnt man sich besser gar nicht
          # erst an.
          if ! docker exec bare srvpanel admin --generate --no-ansi \
                 --name=Rauchtest pruefer@example.test > admin.txt 2>&1; then
            echo "::error::Das Anlegen des Adminkontos scheiterte:"
            grep -v 'Passwort:' admin.txt
            exit 1
          fi

          docker exec bare srvpanel setup --port=8443 --no-ansi > setup2.txt

          grep -q 'Adminkonto ist vorhanden' setup2.txt \
            || { echo "::error::Die Einrichtung erkennt das vorhandene Adminkonto nicht."; cat setup2.txt; exit 1; }

          if grep -q 'srvpanel admin --generate' setup2.txt; then
            echo "::error::Der Hinweis zum Anlegen steht da, obwohl ein Adminkonto existiert."
            cat setup2.txt
            exit 1
          fi
          echo "Zweiter Zweig stimmt."

      - name: Der Agent schreibt keine Warnungen ins Journal
        run: |
          # MemoryDenyWriteExecute verbietet den PCRE-JIT; ohne `-d pcre.jit=0`
          # in der Unit schreibt PHP das bei jedem Fork ins Journal.
          docker exec bare /opt/srvpanel/current/agent/bin/srvpanel-agentd call agent.ping >/dev/null || true
          log="$(docker exec bare journalctl -u srvpanel-agentd --no-pager 2>/dev/null || true)"
          if echo "$log" | grep -q 'PHP Warning'; then
            echo "::error::Der Agent schreibt PHP-Warnungen ins Journal:"
            echo "$log" | grep 'PHP Warning' | head -5
            exit 1
          fi
          echo "Journal ohne PHP-Warnungen."

      - name: Aufräumen
        if: always()
        run: docker rm -f bare || true

  scripts:
    name: Shell-Skripte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq shellcheck
          # SC1091 ist ausgenommen: /etc/os-release und /etc/srvpanel/php.path
          # gibt es auf dem Prüfrechner nicht, und beide sind keine Quelldateien
          # dieses Projekts. SC1090 desgleichen für den Pfad aus einer Variablen.
          shellcheck -e SC1091 packaging/install.sh packaging/php-source.sh packaging/scripts/*.sh
          shellcheck packaging/version-channel.sh packaging/release-notes.sh
          shellcheck -e SC1091 packaging/bin/php packaging/bin/php-fpm packaging/bin/srvpanel
          shellcheck -e SC1090,SC1091 packaging/build.sh packaging/testbed.sh packaging/rotate-signing-keys.sh

  supply-chain:
    name: Schwachstellen und Lizenzen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: composer audit
        run: composer audit --no-interaction

      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

      - name: Lizenzen sind mit der AGPL vereinbar
        # §12.2 des Plans: Eine Abhängigkeit unter einer unvereinbaren Lizenz
        # muss auffallen, bevor sie im Paket landet — nicht danach.
        run: |
          composer licenses --format=json > /tmp/lizenzen.json
          php -r '
            // Mehrere Lizenzen sind bei composer ein ODER: Das Paket steht
            // unter einer davon, und wir wählen. nette/utils etwa bietet
            // BSD-3-Clause, GPL-2.0-only und GPL-3.0-only an — die BSD-Fassung
            // ist mit der AGPL vereinbar, also ist das Paket es auch. Ein
            // Befund ist es erst, wenn KEINE der angebotenen Lizenzen passt.
            $verboten = ["proprietary", "GPL-2.0-only", "GPL-2.0", "SSPL-1.0", "BUSL-1.1", "Elastic-2.0"];
            $daten = json_decode(file_get_contents("/tmp/lizenzen.json"), true);
            $treffer = [];
            foreach ($daten["dependencies"] ?? [] as $name => $paket) {
                $lizenzen = (array) ($paket["license"] ?? []);
                if ($lizenzen === []) { $treffer[] = $name . " (keine Lizenzangabe)"; continue; }
                $offen = array_diff($lizenzen, $verboten);
                if ($offen === []) { $treffer[] = $name . " (" . implode(" oder ", $lizenzen) . ")"; }
            }
            if ($treffer) { fwrite(STDERR, "Unvereinbare Lizenzen: " . implode(", ", $treffer) . "\n"); exit(1); }
            echo "Alle Lizenzen sind mit AGPL-3.0-only vereinbar.\n";'
