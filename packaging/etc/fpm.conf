; PHP-FPM für die Panel-Oberfläche.
;
; Ein eigener Pool mit eigener Konfiguration, getrennt von dem, was die
; Distribution mitbringt: Das Panel soll nicht mitwandern, wenn jemand die
; PHP-Einstellungen des Systems ändert — und die PHP-Version der Kunden nicht
; von der des Panels abhängen.

[global]
pid = /run/cloudsrv/fpm.pid
error_log = /var/log/cloudsrv/fpm.log
daemonize = no

[cloudsrv]
user = cloudsrv
group = cloudsrv

listen = /run/cloudsrv/fpm.sock
listen.owner = cloudsrv
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; Ein Vorgang mit Live-Ausgabe hält die Verbindung offen, solange er läuft.
; Das Standardlimit von 30 s würde ihn mitten im Lauf abschneiden.
request_terminate_timeout = 3600s

php_admin_value[error_log] = /var/log/cloudsrv/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 256M
php_admin_value[post_max_size] = 256M
php_admin_value[sys_temp_dir] = /var/lib/cloudsrv/tmp
php_admin_value[upload_tmp_dir] = /var/lib/cloudsrv/tmp
php_admin_value[session.save_path] = /var/lib/cloudsrv/tmp

; Das Panel liest und schreibt in seinem eigenen Bereich. Der Rest des
; Dateisystems geht über den Agenten — und nur über typisierte Operationen.
php_admin_value[open_basedir] = /opt/cloudsrv:/etc/cloudsrv:/var/lib/cloudsrv:/var/log/cloudsrv:/run/cloudsrv:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

env[PATH] = /usr/local/bin:/usr/bin:/bin
