version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - wastedassign

  settings:
    gosec:
      excludes:
        # G104 doppelt sich mit errcheck.
        - G104
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      # In Tests sind Hilfsdateien mit weiten Rechten und feste Pfade in
      # Ordnung; die strengen Regeln gelten dem Produktivcode.
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
