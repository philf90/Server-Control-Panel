version: 2
project_name: asylum

before:
  hooks:
    - go mod tidy

builds:
  - id: asylumd
    main: ./cmd/asylumd
    binary: asylumd
    env:
      # Statisch gelinkt: das Binary läuft ohne Runtime-Abhängigkeiten auf
      # jedem unterstützten System.
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/philf90/asylum/internal/version.Version={{ .Version }}
      - -X github.com/philf90/asylum/internal/version.Commit={{ .FullCommit }}
      - -X github.com/philf90/asylum/internal/version.Date={{ .CommitDate }}
    # Reproduzierbare Builds: Zeitstempel aus dem Commit statt aus der Uhr.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    # Der Installer erwartet genau diesen Namen.
    name_template: "asylumd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Kein Unterverzeichnis: install.sh entpackt flach und greift auf ./asylumd zu.
    wrap_in_directory: false
    files:
      - LICENSE
      - README.md

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

signs:
  # minisign signiert die Prüfsummendatei. Der Installer prüft diese Signatur
  # gegen den in ihm eingebetteten Public Key und danach die Prüfsumme des
  # Archivs — eine Kette, die keine Netzabfrage braucht.
  - id: minisign
    cmd: minisign
    args:
      - -s
      - "{{ .Env.MINISIGN_KEY_FILE }}"
      - -Sm
      - "${artifact}"
      - -t
      - "Project Asylum {{ .Version }}"
    stdin: "{{ .Env.MINISIGN_PASSWORD }}"
    signature: "${artifact}.minisig"
    artifacts: checksum

nfpms:
  - id: deb
    # Nicht "asylum": Dieser Name ist in Debian und Ubuntu seit Jahren an ein
    # Spiel vergeben (universe/games, "surreal platform shooting game"), und
    # dessen Fassung 0.3.2 liegt über unserer. "apt install asylum" brächte
    # also das Spiel, selbst wenn dieses Repository eingebunden ist. Der
    # Befehl heißt weiterhin asylum: /usr/bin/asylum steht im PATH vor
    # /usr/games/asylum, und weil die Pfade sich unterscheiden, streiten sich
    # die beiden Pakete auch nicht um eine Datei.
    package_name: asylum-panel
    vendor: Project Asylum
    homepage: https://repo.cloudsrv24.de/
    maintainer: Project Asylum <noreply@users.noreply.github.com>
    description: |
      Schlankes Control Panel für Linux-Server.
      Administration, Security, YAML, Logs, Updates, Monitoring — ein Binary,
      keine Runtime-Abhängigkeiten.
    license: Apache-2.0
    formats: [deb]
    section: admin
    priority: optional
    # Paketpfade folgen der FHS; der curl-Installer nutzt /usr/local und
    # schreibt seine eigene Unit — die beiden Wege kommen sich nicht ins Gehege.
    bindir: /usr/lib/asylum
    dependencies:
      - systemd
    # Recommends, nicht Depends: Das .deb wird auch einzeln aus einem
    # GitHub-Release installiert, und eine harte Abhängigkeit auf ein Paket,
    # das dann in keiner Quelle steht, ließe genau diese Installation
    # scheitern. Aus dem Repository heraus wird es trotzdem mitinstalliert.
    recommends:
      - minisign
      - asylum-archive-keyring
    contents:
      - src: packaging/systemd/asylumd.service
        dst: /lib/systemd/system/asylumd.service
      - src: LICENSE
        dst: /usr/share/doc/asylum/LICENSE
      - dst: /etc/asylum
        type: dir
        file_info:
          mode: 0750
      - dst: /var/lib/asylum
        type: dir
        file_info:
          mode: 0750
      - dst: /var/log/asylum
        type: dir
        file_info:
          mode: 0750
    scripts:
      postinstall: packaging/nfpm/postinstall.sh
      preremove: packaging/nfpm/preremove.sh
      postremove: packaging/nfpm/postremove.sh

  # Eigenes Paket für den Schlüsselbund, nach dem Vorbild von
  # debian-archive-keyring. Der Grund ist erst beim Deinstallieren sichtbar:
  # Läge die Datei im Panel-Paket, nähme "apt remove asylum-panel" sie mit —
  # und die Paketquelle stünde ohne Schlüssel da, mit NO_PUBKEY bei jedem
  # weiteren "apt update". Getrennt bleibt der Schlüssel liegen, und ein
  # Schlüsselwechsel lässt sich später über ein gewöhnliches Update
  # ausliefern.
  - id: keyring
    package_name: asylum-archive-keyring
    vendor: Project Asylum
    homepage: https://repo.cloudsrv24.de/
    maintainer: Project Asylum <noreply@users.noreply.github.com>
    description: |
      Schlüsselbund des Project-Asylum-APT-Repositories.
      Enthält den öffentlichen OpenPGP-Schlüssel, mit dem die Release-Dateien
      unter https://repo.cloudsrv24.de/apt signiert sind.
    license: Apache-2.0
    formats: [deb]
    section: admin
    priority: optional
    contents:
      - src: packaging/asylum-archive-keyring.gpg
        dst: /usr/share/keyrings/asylum-archive-keyring.gpg
      - src: packaging/asylum-archive-keyring.asc
        dst: /usr/share/doc/asylum-archive-keyring/asylum-archive-keyring.asc

sboms:
  - id: archive
    artifacts: archive

release:
  github:
    owner: philf90
    name: Server-Control-Panel
  draft: false
  prerelease: auto
  extra_files:
    # Der Installer wird als Release-Artefakt mitveröffentlicht, damit die URL
    # auf einen unveränderlichen Stand zeigt und nicht auf einen Branch.
    - glob: packaging/install.sh

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
