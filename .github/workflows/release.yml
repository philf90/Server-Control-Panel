name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Fassung ohne führendes v, z. B. 0.1.0'
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Paket bauen und signieren
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: release
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # 8.4, nicht weniger: composer.json verlangt ^8.4 (Laravel 13 setzt
      # Symfony 8 voraus). Mit 8.3 bricht schon das composer install in
      # build.sh ab — und zwar erst in der Freigabe, weil die CI hier nicht
      # hinsieht.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sockets, pcntl, posix, mbstring, intl, zip
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: nfpm bereitstellen
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Bauen
        run: |
          packaging/build.sh "${{ steps.release.outputs.version }}" amd64
          packaging/build.sh "${{ steps.release.outputs.version }}" arm64

      - name: Prüfsummen
        run: |
          cd dist
          sha256sum ./*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Signieren
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign

          if [ -z "${MINISIGN_KEY:-}" ]; then
            echo "::error::Secret MINISIGN_KEY fehlt — ohne Signatur wird nicht veröffentlicht."
            exit 1
          fi

          printf '%s\n' "$MINISIGN_KEY" > "${RUNNER_TEMP}/minisign.key"
          printf '%s\n' "${MINISIGN_PASSWORD:-}" \
            | minisign -s "${RUNNER_TEMP}/minisign.key" -Sm dist/SHA256SUMS >/dev/null

          # Passt der hinterlegte Schlüssel zum veröffentlichten? Ein
          # vertauschter fällt sonst erst bei den Nutzern auf.
          minisign -Vm dist/SHA256SUMS -P "$(tail -n1 packaging/minisign.pub)"
          rm -f "${RUNNER_TEMP}/minisign.key"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: GitHub-Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "SrvPanel ${{ steps.release.outputs.version }}" \
            --notes "Siehe CHANGELOG.md." \
            $(case "${{ steps.release.outputs.version }}" in *-*) echo --prerelease ;; esac)

  repository:
    name: repo.cloudsrv24.de aktualisieren
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Kanal bestimmen
        id: channel
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) echo "name=beta"   >> "$GITHUB_OUTPUT" ;;
            *)   echo "name=stable" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Installer und Schlüssel veröffentlichen
        run: |
          set -euo pipefail
          cd pages

          # CNAME und .nojekyll gehören der Pages-Konfiguration und werden hier
          # nie angefasst.
          test -f CNAME || echo "WARNUNG: CNAME fehlt im Pages-Branch"
          touch .nojekyll

          cp ../src/packaging/install.sh install.sh
          chmod 0644 install.sh

          # php-source.sh muss mit — install.sh holt es sich von hier, wenn es
          # allein heruntergeladen wurde, und genau so steht es in seinem
          # eigenen Kopf. Es fehlte, und der Fehlschlag war unsichtbar: `curl
          # -f` lief ins 404, gab nichts aus, das leere `sh` endete mit 0. Ohne
          # PHP-Quelle scheiterte dann die Installation mit einer apt-Meldung
          # über php8.4-cli, die niemand mit der Ursache verbindet.
          cp ../src/packaging/php-source.sh php-source.sh
          chmod 0644 php-source.sh

          cp ../src/packaging/minisign.pub minisign.pub
          mkdir -p apt
          cp ../src/packaging/srvpanel-archive-keyring.gpg apt/srvpanel-archive-keyring.gpg
          cp ../src/packaging/srvpanel-archive-keyring.asc apt/KEY.asc

      # Die Startseite kommt aus dem Repository, nicht aus diesem Branch.
      #
      # Vorher lag sie ausschließlich hier auf gh-pages und wurde von keinem
      # Lauf angefasst. Sie hat deshalb den ganzen Namenswechsel überlebt und
      # noch „Project Asylum" angezeigt, während das Repository längst
      # SrvPanel auslieferte. Was nur an einer Stelle steht, die niemand
      # baut, veraltet unbemerkt.
      #
      # Version, Kanal und beide Schlüssel werden beim Kopieren eingesetzt,
      # damit die Seite nicht ein zweites Mal von der Wirklichkeit abweichen
      # kann.
      - name: Startseite veröffentlichen
        env:
          VERSION: ${{ needs.package.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          set -euo pipefail

          fingerprint="$(gpg --show-keys --with-colons src/packaging/srvpanel-archive-keyring.gpg \
                         | awk -F: '/^fpr/{print $10; exit}')"
          minisign_pub="$(tail -n1 src/packaging/minisign.pub)"

          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__CHANNEL__|${CHANNEL}|g" \
              -e "s|__GPG_FINGERPRINT__|${fingerprint}|g" \
              -e "s|__MINISIGN_PUB__|${minisign_pub}|g" \
              src/packaging/pages/index.html > pages/index.html

          # Keine Platzhalter dürfen stehenbleiben — eine Seite mit
          # __VERSION__ darauf ist schlimmer als eine veraltete.
          if grep -n '__[A-Z_]*__' pages/index.html; then
            echo "::error::In der Startseite sind Platzhalter übriggeblieben."
            exit 1
          fi

      - name: APT-Repository aktualisieren
        env:
          VERSION: ${{ needs.package.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.name }}
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          # Ohne hinterlegten Schlüssel wird der Schritt übersprungen, statt ein
          # unsigniertes Repository zu veröffentlichen. Ein unsigniertes
          # apt-Repository ist schlimmer als gar keines.
          if [ -z "${APT_GPG_KEY:-}" ]; then
            echo "::warning::Secret APT_GPG_KEY fehlt — das APT-Repository wird nicht aktualisiert."
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils gnupg

          cd pages
          mkdir -p "apt/dists/${CHANNEL}/main/binary-amd64" "apt/dists/${CHANNEL}/main/binary-arm64"

          # Jedes Paket unter seinem eigenen Namen in den Pool — Debian-Konvention
          # pool/main/<anfangsbuchstabe>/<paket>/.
          #
          # Das Paket des Vorgängers liegt daneben und wird von hier an nicht
          # mehr angefasst. „Von hier an": Der erste Lauf unter dem neuen Namen
          # hat seine älteren Fassungen aus dem Pool geräumt, weil das
          # Zurückschneiden weiter unten über alle Verzeichnisse lief. Das ist
          # behoben, aber nicht rückgängig gemacht — die Entscheidung war,
          # die 404 MiB nicht zurückzuholen. Geblieben sind asylum-panel 0.6.1
          # und 0.6.2; bestehende Installationen können damit weiter
          # aktualisieren, ältere Fassungen sind nicht mehr installierbar.
          published=""
          for deb in ../dist/*.deb; do
            name="$(dpkg-deb -f "$deb" Package)"
            dir="apt/pool/main/${name:0:1}/${name}"
            mkdir -p "$dir"
            cp "$deb" "$dir/"
            published="${published} ${name}"
          done

          # Pages fasst rund 1 GB. Ein .deb dieses Panels liegt bei 30–80 MB,
          # also bleiben im Pool nur die letzten fünf Fassungen je Paket; ältere
          # sind weiter über die GitHub-Releases erreichbar. Ohne diese Regel ist
          # die Grenze nach etwa einem Jahr erreicht — und dann bricht nicht der
          # Upload, sondern die Auslieferung an alle.
          #
          # **Nur die Pakete dieses Laufs.** Vorher lief die Schleife über
          # jedes Verzeichnis unter pool/main. Der erste Lauf unter dem neuen
          # Namen hat damit 92 Dateien des Vorgängers gelöscht — 404 MiB, auf
          # die der stable-Index weiter verweist. Zwanzig Zeilen weiter oben
          # stand zur selben Zeit, das Paket des Vorgängers werde „nicht
          # angefasst". Eine Regel, die über alles läuft, kennt den
          # Unterschied zwischen eigenen und fremden Paketen nicht; sie muss
          # ihn übergeben bekommen.
          for name in $(echo "${published}" | tr ' ' '\n' | grep -v '^$' | sort -u); do
            package_dir="apt/pool/main/${name:0:1}/${name}"
            ls -1t "${package_dir}"/*.deb 2>/dev/null | tail -n +6 | xargs -r rm -f
          done

          # Aus apt heraus, nicht darüber: apt-ftparchive schreibt den übergebenen
          # Pfad wörtlich ins Feld „Filename". Von außen aufgerufen stünde dort
          # „apt/pool/…", und apt suchte unter …/apt/apt/pool/….
          (
            cd apt
            for arch in amd64 arm64; do
              apt-ftparchive --arch "$arch" packages pool > "dists/${CHANNEL}/main/binary-${arch}/Packages"
              gzip -9kf "dists/${CHANNEL}/main/binary-${arch}/Packages"
            done

            # Über eine Zwischendatei: Die Umleitung legt die Zieldatei an, bevor
            # apt-ftparchive das Verzeichnis liest — Release stünde sonst mit
            # einer Prüfsumme über sich selbst in der eigenen Liste.
            rm -f "dists/${CHANNEL}/Release"
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="SrvPanel" \
              -o APT::FTPArchive::Release::Label="SrvPanel" \
              -o APT::FTPArchive::Release::Suite="${CHANNEL}" \
              -o APT::FTPArchive::Release::Codename="${CHANNEL}" \
              -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
              -o APT::FTPArchive::Release::Components="main" \
              -o APT::FTPArchive::Release::Description="SrvPanel ${CHANNEL}" \
              release "dists/${CHANNEL}" > "${RUNNER_TEMP}/Release"
            mv "${RUNNER_TEMP}/Release" "dists/${CHANNEL}/Release"
          )

          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_KEY" | gpg --batch --import

          # Verglichen wird der Fingerprint, nicht die Datei: Schlüsselbunde
          # können sich in Signaturen und Zeitstempeln unterscheiden und trotzdem
          # denselben Schlüssel meinen.
          fpr_secret="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          fpr_public="$(gpg --show-keys --with-colons ../src/packaging/srvpanel-archive-keyring.gpg \
                        | awk -F: '/^fpr/{print $10; exit}')"
          if [ "$fpr_secret" != "$fpr_public" ]; then
            echo "::error::Der hinterlegte Schlüssel ($fpr_secret) ist nicht der veröffentlichte ($fpr_public)."
            exit 1
          fi

          gpg --batch --yes --pinentry-mode loopback --passphrase "${APT_GPG_PASSPHRASE:-}" \
              --clearsign -o "apt/dists/${CHANNEL}/InRelease" "apt/dists/${CHANNEL}/Release"
          gpg --batch --yes --pinentry-mode loopback --passphrase "${APT_GPG_PASSPHRASE:-}" \
              -abs -o "apt/dists/${CHANNEL}/Release.gpg" "apt/dists/${CHANNEL}/Release"

      - name: Veröffentlichen
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nichts zu veröffentlichen."; exit 0; }
          git commit -m "repo: SrvPanel ${{ needs.package.outputs.version }} (${{ steps.channel.outputs.name }})"
          git push
