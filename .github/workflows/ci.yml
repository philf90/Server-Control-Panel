name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'

jobs:
  static:
    name: Statische Prüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sockets, pcntl, posix, mbstring, intl, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: composer.json prüfen
        run: composer validate --strict

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Der Agent hängt an nichts
        # Die Zusage aus §4.1: Was als root läuft, kommt ohne Composer aus.
        # Ein use-Statement auf einen vendor-Namensraum bricht sie — und weil
        # so etwas beim Lesen eines Diffs durchgeht, prüft es die CI.
        run: |
          if grep -rnE '^use (Illuminate|Symfony|Laravel|Inertia|Composer)\\' agent/src agent/bin; then
            echo "::error::Der Agent verweist auf eine Bibliothek der Anwendung."
            exit 1
          fi
          php -r 'require "agent/src/autoload.php";
                  new SrvPanel\Agent\Registry(new SrvPanel\Agent\Config());
                  if (class_exists("Composer\Autoload\ClassLoader", false)) { fwrite(STDERR, "vendor/ war geladen.\n"); exit(1); }
                  echo "Der Agent lädt ohne vendor/.\n";'

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sockets, pcntl, posix, mbstring, intl, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  ui:
    name: Oberfläche
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - name: Typen
        run: npm run types
      - name: Bundle
        run: npm run build

      - name: Farbwerte stehen nur in app.css
        # Vorgabe aus §7.2: Jede Farbe kommt aus den Marken. Ein Hexwert in
        # einer Komponente ist der Anfang vom Ende des zweiten Themes.
        run: |
          if grep -rnE '#[0-9a-fA-F]{3,8}\b' resources/js --include='*.vue' --include='*.ts'; then
            echo "::error::Farbwert außerhalb von app.css. Marke aus resources/css/app.css benutzen."
            exit 1
          fi
          echo "Keine Farbwerte außerhalb der Marken."

  integration:
    name: Installation auf ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Der Zweig, den es beim Vorgänger nicht gab — und der Grund, warum dort
    # eine systemd-Härtung jede Paketinstallation unmöglich machen konnte,
    # ohne dass ein Test es merkte. Hier läuft das gebaute Paket unter echtem
    # systemd auf jeder zugesagten Plattform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12
          - name: Debian 13
            image: debian:13
          - name: Ubuntu 22.04
            image: ubuntu:22.04
          - name: Ubuntu 24.04
            image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sockets, pcntl, posix, mbstring, intl, zip
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: nfpm bereitstellen
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Paket bauen
        run: packaging/build.sh 0.0.0-ci amd64

      - name: Container mit systemd starten
        run: |
          docker run -d --name target --privileged \
            --tmpfs /run --tmpfs /run/lock -v /sys/fs/cgroup:/sys/fs/cgroup:rw --cgroupns=host \
            -v "${PWD}/dist:/packages:ro" \
            ${{ matrix.image }} /bin/sh -c \
            'apt-get update -qq && apt-get install -y -qq systemd systemd-sysv >/dev/null && exec /sbin/init'
          for i in $(seq 1 60); do
            if docker exec target systemctl is-system-running 2>/dev/null | grep -qE 'running|degraded'; then break; fi
            sleep 2
          done
          docker exec target systemctl --version | head -1

      - name: PHP-Quelle und PHP 8.4
        # Denselben Weg geht install.sh. Von den vier Zielplattformen liefert nur
        # Debian 13 PHP 8.4 aus eigenen Quellen — Laravel 13 verlangt es.
        run: |
          # Über die Standardeingabe statt über docker cp: systemd hängt beim
          # Booten ein tmpfs über /tmp, und docker cp schreibt in den darunter
          # liegenden Baum — die Datei ist im Container dann unsichtbar.
          docker exec -i target sh -s < packaging/php-source.sh
          docker exec target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            php8.4-cli php8.4-fpm php8.4-mbstring php8.4-xml php8.4-curl php8.4-mysql curl'
          docker exec target php8.4 --version

      - name: Paket installieren
        run: |
          docker exec target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/*.deb'

      - name: Der Agent läuft und antwortet
        run: |
          docker exec target systemctl is-active srvpanel-agentd.service
          docker exec target /opt/srvpanel/current/agent/bin/srvpanel-agentd call agent.ping
          docker exec target /opt/srvpanel/current/agent/bin/srvpanel-agentd call system.info | head -5

      # Die Anmeldung hängt daran (§6.4). Ob das ausgelieferte PHP Argon2id
      # kann, ist keine Frage der Konfiguration, sondern des Übersetzens —
      # und damit eine Eigenschaft der Plattform, nicht des Projekts. Fehlt
      # es, scheitert nicht die Anmeldung, sondern schon das Anlegen des
      # ersten Adminkontos; das soll hier auffallen und nicht dort.
      - name: PHP kann Argon2id
        run: |
          docker exec target /opt/srvpanel/bin/php -r '
            if (! defined("PASSWORD_ARGON2ID")) { fwrite(STDERR, "PASSWORD_ARGON2ID fehlt\n"); exit(1); }
            $h = password_hash("probe", PASSWORD_ARGON2ID, ["memory_cost" => 65536, "time_cost" => 4, "threads" => 1]);
            if (! is_string($h) || ! str_starts_with($h, "$argon2id$")) { fwrite(STDERR, "kein argon2id-Hash\n"); exit(1); }
            if (! password_verify("probe", $h)) { fwrite(STDERR, "Prüfung schlug fehl\n"); exit(1); }
            echo "argon2id: ", substr($h, 0, 30), "\n";
          '

      - name: Der Socket ist nicht für alle offen
        run: |
          mode="$(docker exec target stat -c '%a %U:%G' /run/srvpanel/agent.sock)"
          echo "Socket: ${mode}"
          case "${mode}" in
            "660 root:srvpanel") ;;
            *) echo "::error::Socket steht auf ${mode}, erwartet ist 660 root:srvpanel"; exit 1 ;;
          esac

      - name: Ersteinrichtung und Oberfläche
        run: |
          docker exec target sh -c 'systemctl start mariadb || service mariadb start' || true
          sleep 5
          docker exec target srvpanel setup --port=8443
          docker exec target curl -fsS -k https://127.0.0.1:8443/health
          echo

      - name: Ein zweiter Lauf der Ersteinrichtung ändert nichts
        # Wiederholbarkeit ist keine Kür: Wer nach einem Fehlschlag noch einmal
        # einrichtet, darf dabei nicht den Schlüssel wechseln — sonst ist die
        # Datenbank danach unlesbar.
        run: |
          vorher="$(docker exec target grep '^APP_KEY=' /etc/srvpanel/panel.env)"
          docker exec target srvpanel setup --port=8443 >/dev/null
          nachher="$(docker exec target grep '^APP_KEY=' /etc/srvpanel/panel.env)"
          [ "$vorher" = "$nachher" ] || { echo "::error::Der APP_KEY hat sich beim zweiten Lauf geändert."; exit 1; }
          echo "Der Schlüssel ist geblieben."

      - name: Entfernen hinterlässt keine Dienste, aber die Daten
        run: |
          docker exec target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get remove -y srvpanel'
          ! docker exec target systemctl is-active srvpanel-agentd.service
          docker exec target test -d /var/lib/srvpanel

      # In diesem Container hat der Schritt „PHP-Quelle und PHP 8.4" die
      # Quelldatei angelegt, bevor srvpanel-php-source überhaupt installiert
      # wurde. Sie gehört dem Paket also nicht, und ein purge darf sie nicht
      # mitnehmen: Zurück bliebe sonst ein System mit installiertem PHP 8.4,
      # für das es keine Sicherheitsupdates mehr gibt — unbemerkt, denn nichts
      # daran sieht kaputt aus.
      - name: Ein purge nimmt keine fremde PHP-Quelle mit
        run: |
          # Als if und nicht als `test … && var=ja`: Der Lauf steht unter
          # `bash -e`, und der Rückgabewert einer UND-Liste ist der des
          # fehlgeschlagenen Tests — der Schritt bräche ab, sobald die Datei
          # fehlt, also genau auf Debian 13.
          before=nein
          if docker exec target test -f /etc/apt/sources.list.d/php-sury.sources; then before=ja; fi
          echo "Quelle vor dem purge vorhanden: ${before}"

          docker exec target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get purge -y srvpanel-php-source'

          after=nein
          if docker exec target test -f /etc/apt/sources.list.d/php-sury.sources; then after=ja; fi

          if [ "${before}" != "${after}" ]; then
            echo "::error::purge hat die PHP-Quelle entfernt, obwohl das Paket sie nicht angelegt hat"
            exit 1
          fi
          echo "Quelle nach dem purge vorhanden: ${after} — unverändert."

      - name: Aufräumen
        if: always()
        run: docker rm -f target || true

  # Die Abhängigkeiten eines Pakets kann man nur prüfen, indem man es allein
  # installiert.
  #
  # Der Job oben spielt PHP samt Erweiterungen vorher ein — denselben Weg geht
  # install.sh, und deshalb war dort nie zu sehen, dass das Paket `php8.4-mysql`
  # nicht als Abhängigkeit führte. Wer `apt install srvpanel` tippte, bekam ein
  # Panel ohne Datenbanktreiber; die Ersteinrichtung starb bei den Migrationen
  # mit „could not find driver". Gefunden hat das kein Test, sondern der erste
  # Mensch, der es auf einem eigenen Server versucht hat.
  #
  # Hier wird deshalb ausschließlich das Paket installiert, und apt muss alles
  # Weitere selbst herbeischaffen.
  bare-install:
    name: Nur das Paket auf ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 13 hat PHP 8.4 im Bestand: hier genügt `apt install srvpanel`
          # tatsächlich allein.
          - name: Debian 13
            image: debian:13
            needs_php_source: 'nein'
          # Debian 12 braucht vorher srvpanel-php-source — das ist die
          # dokumentierte Voraussetzung, und mehr darf es nicht sein.
          - name: Debian 12
            image: debian:12
            needs_php_source: 'ja'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sockets, pcntl, posix, mbstring, intl, zip
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: nfpm bereitstellen
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Paket bauen
        run: packaging/build.sh 0.0.0-ci amd64

      - name: Container mit systemd starten
        run: |
          docker run -d --name bare --privileged \
            --tmpfs /run --tmpfs /run/lock -v /sys/fs/cgroup:/sys/fs/cgroup:rw --cgroupns=host \
            -v "${PWD}/dist:/packages:ro" \
            ${{ matrix.image }} /bin/sh -c \
            'apt-get update -qq && apt-get install -y -qq systemd systemd-sysv >/dev/null && exec /sbin/init'
          for i in $(seq 1 60); do
            if docker exec bare systemctl is-system-running 2>/dev/null | grep -qE 'running|degraded'; then break; fi
            sleep 2
          done

      - name: PHP-Quelle — nur wo sie Voraussetzung ist
        if: matrix.needs_php_source == 'ja'
        run: |
          docker exec bare sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /packages/srvpanel-php-source_*.deb'
          docker exec bare sh -c 'apt-get update -qq'

      - name: Nur das Paket, sonst nichts
        run: |
          # Kein php8.4-* auf der Kommandozeile, keine Erweiterungen von Hand:
          # Was fehlt, muss apt aus den Abhängigkeiten des Pakets ableiten.
          docker exec bare sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/srvpanel_*.deb'

      - name: Der Datenbanktreiber ist da
        run: |
          # Die eine Zeile, die im Juli gefehlt hat.
          docker exec bare /opt/srvpanel/bin/php -r '
            if (! extension_loaded("pdo_mysql")) { fwrite(STDERR, "pdo_mysql fehlt\n"); exit(1); }
            echo "pdo_mysql: da\n";
          '
          for ext in mbstring dom curl openssl tokenizer sockets posix pcntl; do
            docker exec bare /opt/srvpanel/bin/php -r "
              if (! extension_loaded('$ext')) { fwrite(STDERR, \"$ext fehlt\n\"); exit(1); }
            " || exit 1
            echo "$ext: da"
          done

      - name: Die Ersteinrichtung läuft durch
        run: |
          docker exec bare sh -c 'systemctl start mariadb || service mariadb start' || true
          sleep 5
          # --no-ansi: Ohne TTY schaltet Symfony die Einfärbung zwar von
          # selbst ab, aber der Test unten liest diese Datei — und eine
          # Prüfung, die von einer Vermutung über das Terminal abhängt, ist
          # keine.
          docker exec bare srvpanel setup --port=8443 --no-ansi | tee setup.txt
          docker exec bare curl -fsS -k https://127.0.0.1:8443/health
          echo

      # Was die Einrichtung sagt, ist das Einzige, was der Betreiber danach
      # hat. Genau hier fehlte eine Prüfung: Der Schlusssatz „Anmeldung und
      # Konten kommen mit der Ausbaustufe P1" war seit P1 falsch und stand ein
      # halbes Jahr da — wer ihn las, hörte auf, nach einem Adminkonto zu
      # suchen. Gefunden hat ihn kein Lauf, sondern der erste Mensch, der die
      # Einrichtung durchlaufen liess.
      - name: Die Einrichtung sagt, wie es weitergeht
        run: |
          echo "── Ausgabe ──"; cat setup.txt; echo "─────────────"

          # 1. Die Adresse muss aufloesbar sein. Ein blosser Rechnername ohne
          #    Punkt ist es ausserhalb des Rechners nicht — genau das stand
          #    dort: https://cloudsrv24:8443/
          #
          #    Geprueft wird auf einen Punkt. Das deckt beides ab, den
          #    vollstaendigen Namen und die IP-Adresse, und ist die Eigenschaft,
          #    an der es tatsaechlich lag.
          url="$(grep -oE 'https://[^ /]+' setup.txt | head -1 | sed 's#https://##')"
          echo "Adresse: ${url}"
          if ! echo "${url}" | grep -q '\.'; then
            echo "::error::Die Einrichtung nennt ${url} - kein Punkt darin, also von aussen nicht aufloesbar."
            exit 1
          fi

          # 2. Ohne Adminkonto muss der Befehl dastehen, mit dem man eines
          #    anlegt. Ohne ihn kommt niemand in ein frisch eingerichtetes
          #    Panel hinein.
          grep -q 'srvpanel admin' setup.txt \
            || { echo "::error::Kein Hinweis auf srvpanel admin, obwohl es kein Adminkonto gibt."; exit 1; }

          # 3. Und der alte Satz darf nicht zurückkommen.
          if grep -qi 'Ausbaustufe P1' setup.txt; then
            echo "::error::Der Satz über die Ausbaustufe P1 ist wieder da — er war seit P1 falsch."
            exit 1
          fi
          echo "Adresse auflösbar, Hinweis vorhanden, alter Satz weg."

      - name: Mit Adminkonto sagt sie etwas anderes
        run: |
          # Der zweite Zweig. Ein Test, der nur den Fall ohne Konto prüft,
          # bliebe grün, wenn der Hinweis unbedingt erschiene — und dann
          # stünde er auch auf Servern, die längst eingerichtet sind.
          docker exec bare srvpanel admin --generate --name=Rauchtest pruefer@example.test >/dev/null
          docker exec bare srvpanel setup --port=8443 | tee setup2.txt >/dev/null

          grep -q 'Adminkonto ist vorhanden' setup2.txt \
            || { echo "::error::Die Einrichtung erkennt das vorhandene Adminkonto nicht."; cat setup2.txt; exit 1; }

          if grep -q 'srvpanel admin --generate' setup2.txt; then
            echo "::error::Der Hinweis zum Anlegen steht da, obwohl ein Adminkonto existiert."
            cat setup2.txt
            exit 1
          fi
          echo "Zweiter Zweig stimmt."

      - name: Der Agent schreibt keine Warnungen ins Journal
        run: |
          # MemoryDenyWriteExecute verbietet den PCRE-JIT; ohne `-d pcre.jit=0`
          # in der Unit schreibt PHP das bei jedem Fork ins Journal.
          docker exec bare /opt/srvpanel/current/agent/bin/srvpanel-agentd call agent.ping >/dev/null || true
          log="$(docker exec bare journalctl -u srvpanel-agentd --no-pager 2>/dev/null || true)"
          if echo "$log" | grep -q 'PHP Warning'; then
            echo "::error::Der Agent schreibt PHP-Warnungen ins Journal:"
            echo "$log" | grep 'PHP Warning' | head -5
            exit 1
          fi
          echo "Journal ohne PHP-Warnungen."

      - name: Aufräumen
        if: always()
        run: docker rm -f bare || true

  scripts:
    name: Shell-Skripte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091 ist ausgenommen: /etc/os-release und /etc/srvpanel/php.path
          # gibt es auf dem Prüfrechner nicht, und beide sind keine Quelldateien
          # dieses Projekts. SC1090 desgleichen für den Pfad aus einer Variablen.
          shellcheck -e SC1091 packaging/install.sh packaging/php-source.sh packaging/scripts/*.sh
          shellcheck -e SC1091 packaging/bin/php packaging/bin/php-fpm packaging/bin/srvpanel
          shellcheck -e SC1090,SC1091 packaging/build.sh packaging/testbed.sh packaging/rotate-signing-keys.sh

  supply-chain:
    name: Schwachstellen und Lizenzen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: composer audit
        run: composer audit --no-interaction

      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

      - name: Lizenzen sind mit der AGPL vereinbar
        # §12.2 des Plans: Eine Abhängigkeit unter einer unvereinbaren Lizenz
        # muss auffallen, bevor sie im Paket landet — nicht danach.
        run: |
          composer licenses --format=json > /tmp/lizenzen.json
          php -r '
            // Mehrere Lizenzen sind bei composer ein ODER: Das Paket steht
            // unter einer davon, und wir wählen. nette/utils etwa bietet
            // BSD-3-Clause, GPL-2.0-only und GPL-3.0-only an — die BSD-Fassung
            // ist mit der AGPL vereinbar, also ist das Paket es auch. Ein
            // Befund ist es erst, wenn KEINE der angebotenen Lizenzen passt.
            $verboten = ["proprietary", "GPL-2.0-only", "GPL-2.0", "SSPL-1.0", "BUSL-1.1", "Elastic-2.0"];
            $daten = json_decode(file_get_contents("/tmp/lizenzen.json"), true);
            $treffer = [];
            foreach ($daten["dependencies"] ?? [] as $name => $paket) {
                $lizenzen = (array) ($paket["license"] ?? []);
                if ($lizenzen === []) { $treffer[] = $name . " (keine Lizenzangabe)"; continue; }
                $offen = array_diff($lizenzen, $verboten);
                if ($offen === []) { $treffer[] = $name . " (" . implode(" oder ", $lizenzen) . ")"; }
            }
            if ($treffer) { fwrite(STDERR, "Unvereinbare Lizenzen: " . implode(", ", $treffer) . "\n"); exit(1); }
            echo "Alle Lizenzen sind mit AGPL-3.0-only vereinbar.\n";'
