name: Wächter brechen

# **Warum das ein eigener Lauf ist und nicht ein Job in `ci.yml`.**
#
# Zwei Gründe, und beide sind praktischer Natur:
#
# 1. Das Skript **ändert Dateien** im Arbeitsbaum und stellt sie über git wieder
#    her. In einem Lauf, der nebenher ein Paket baut, wäre das ein Wettlauf um
#    denselben Baum.
# 2. Es fährt die Testsuite einmal je Eingriff — 376 Eingriffe, 623 Läufe. In
#    `ci.yml` hinge das an einem Job, der ohnehin schon die ganze Suite fährt.
#
# **Und warum es ihn überhaupt gibt.** CLAUDE.md verlangt: „Ein Wächter, der nie
# rot war, ist kein Wächter." Das Skript stand seit dem Optik-Rework im Repo und
# ist **nie vollständig gelaufen** — in der Entwicklungsumgebung fehlt `vendor/`,
# also wurde es von Hand und stückweise gefahren. Genau dort ist es dreimal in
# einer Woche fündig geworden.
#
# > **Ein Werkzeug, das man nur von Hand fährt, fährt irgendwann niemand mehr.**

on:
  workflow_dispatch:
  # **Und seit dem 13. August 2026 auch an jedem Pull Request.**
  #
  # Hier stand: „Über zweihundert Läufe gehören nicht vor jeden Pull Request,
  # sondern regelmässig und auf Zuruf." Die Zahl stimmte, die Folgerung nicht —
  # **gemessen dauert der ganze Lauf fünf Minuten**, weniger als der
  # Installationsjob auf Ubuntu 22.04, den niemand infrage stellt. Die Vorsicht
  # galt einer Rechnung, die nie jemand gemacht hat.
  #
  # Entschieden hat es ein Befund: Am 13. August meldete der Wochenlauf drei
  # Prüfungen ohne Biss, und alle drei hingen an einem Umbau vom 11. — zwei Tage
  # lang stand im Repo ein Wächter, den es nicht mehr gab, und einer, der seine
  # Regel nicht hielt. An dem Pull Request, der sie verlor, wäre es sofort
  # aufgefallen.
  #
  # > **Ein Lauf, der wöchentlich prüft, findet Fehler, die eine Woche alt sein
  # > dürfen.**
  pull_request:
  schedule:
    # Montags um 04:00 UTC. Der Zeitplan **bleibt**, obwohl der Lauf jetzt an
    # jedem Pull Request hängt: Er ist der einzige, der auch dann fährt, wenn
    # wochenlang niemand etwas ändert — und was er dann findet, ist kein Fehler
    # von heute, sondern eine Regel, die von aussen gebrochen wurde: eine neue
    # PHP-Fassung, ein anderes Verhalten einer Abhängigkeit.
    - cron: '0 4 * * 1'

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'

jobs:
  brechen:
    name: Jede Regel absichtlich brechen
    runs-on: ubuntu-latest

    # 376 Eingriffe, 623 Testläufe, **gemessen 4:40** am 14. August 2026. Die
    # Zahlen stehen hier, weil sie die Grenze darunter begründen — und sie sind
    # nachgezogen worden, als P5c zwölf Eingriffe dazugelegt hat. Die Vorgabe von
    # sechs Stunden wäre kein Schutz, sondern eine Rechnung — und seit der Lauf
    # an jedem Pull Request hängt, blockiert eine Hängepartie nicht mehr nur
    # eine Nacht, sondern jemandes Arbeit. Dreissig ist das Sechsfache des
    # Gemessenen und immer noch eine Grenze, die etwas bedeutet.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sockets, pcntl, posix, mbstring, intl, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Der Arbeitsbaum ist sauber
        # Das Skript weigert sich bei ungesicherten Änderungen, weil es sie mit
        # `git checkout --` wegwerfen würde. Hier kann das nicht passieren — die
        # Zeile steht trotzdem da, damit ein Fehlschlag den Grund nennt und
        # nicht bloss den Rückgabewert 1.
        run: git diff --quiet || (echo "::error::Der Arbeitsbaum ist nicht sauber." && exit 1)

      - name: tests/waechter-brechen.sh
        run: tests/waechter-brechen.sh
