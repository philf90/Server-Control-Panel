name: Signatur-Secrets prüfen

# Von Hand auszulösen (Actions → Signatur-Secrets prüfen → Run workflow).
#
# Beide Signaturschlüssel liegen als Repository-Secret, werden aber erst beim
# ersten Release wirklich benutzt. Ein Tippfehler beim Einfügen fiele dann
# mitten im Veröffentlichen auf — nach dem Bauen, nach dem Anlegen des
# GitHub-Release, kurz vor dem Punkt, an dem Nutzer die Artefakte sehen.
#
# Dieser Lauf prüft beide Schlüssel vollständig — er signiert wirklich und
# verifiziert das Ergebnis — und veröffentlicht dabei nichts. Alles bleibt im
# temporären Verzeichnis des Runners.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minisign:
    name: minisign (Artefakt-Signatur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schlüssel prüfen
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${MINISIGN_KEY:-}" ]; then
            echo "::error::Secret MINISIGN_KEY fehlt. Ohne ihn kann kein Release signiert werden."
            exit 1
          fi

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq minisign

          umask 077
          # Der Schlüssel ist zweizeilig; ein fehlender Zeilenumbruch am Ende
          # macht ihn unbrauchbar.
          printf '%s\n' "$MINISIGN_KEY" > "${RUNNER_TEMP}/minisign.key"

          echo "probe" > "${RUNNER_TEMP}/probe.txt"
          printf '%s\n' "${MINISIGN_PASSWORD:-}" \
            | minisign -s "${RUNNER_TEMP}/minisign.key" \
                       -Sm "${RUNNER_TEMP}/probe.txt" \
                       -t "Probelauf" > /dev/null

          # Gegen den veröffentlichten Public Key, nicht gegen sich selbst.
          pubkey="$(tail -n1 packaging/minisign.pub)"
          minisign -Vm "${RUNNER_TEMP}/probe.txt" -P "$pubkey" > /dev/null
          echo "MINISIGN_KEY passt zu packaging/minisign.pub."

          # Hier stand einmal eine zweite Prüfung gegen internal/update/key.go:
          # Der Vorgänger war ein Go-Programm und trug den Schlüssel für sein
          # Selbstupdate im Binary. Diese Datei gibt es nicht mehr — das Update
          # läuft über apt und damit über den OpenPGP-Schlüssel, der unten
          # geprüft wird. Die Prüfung lief ins Leere und hätte den Lauf immer
          # scheitern lassen; aufgefallen ist das nie, weil er von Hand
          # ausgelöst wird und seit dem Umbau niemand ihn ausgelöst hat.

  apt:
    name: OpenPGP (APT-Repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schlüssel prüfen
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${APT_GPG_KEY:-}" ]; then
            echo "::error::Secret APT_GPG_KEY fehlt. Das APT-Repository bliebe unsigniert."
            exit 1
          fi

          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"

          if ! printf '%s\n' "$APT_GPG_KEY" | gpg --batch --import 2>&1; then
            echo "::error::Der Schlüssel ließ sich nicht importieren — vermutlich beim Einfügen beschädigt."
            exit 1
          fi

          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')"
          if [ -z "$keyid" ]; then
            echo "::error::Im Secret steckt kein privater Schlüssel."
            exit 1
          fi

          fpr_secret="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          fpr_public="$(gpg --show-keys --with-colons packaging/srvpanel-archive-keyring.gpg \
                        | awk -F: '/^fpr/{print $10; exit}')"
          if [ "$fpr_secret" != "$fpr_public" ]; then
            echo "::error::Der hinterlegte Schlüssel ($fpr_secret) ist nicht der veröffentlichte ($fpr_public)."
            exit 1
          fi
          echo "APT_GPG_KEY passt zu packaging/srvpanel-archive-keyring.gpg: $fpr_secret"

          # Die Passphrase wird nur beim Signieren gebraucht — also wirklich
          # signieren. Ein falsches Passwort fiele sonst erst im Release auf.
          echo "probe" > "${RUNNER_TEMP}/probe.txt"
          if ! gpg --batch --yes --pinentry-mode loopback \
                   --passphrase "${APT_GPG_PASSPHRASE:-}" \
                   --local-user "$keyid" \
                   --armor --detach-sign \
                   -o "${RUNNER_TEMP}/probe.sig" "${RUNNER_TEMP}/probe.txt" 2>&1; then
            echo "::error::Signieren fehlgeschlagen — vermutlich stimmt APT_GPG_PASSPHRASE nicht."
            exit 1
          fi
          echo "APT_GPG_PASSPHRASE ist richtig, der Schlüssel signiert."

          # Gegenprobe aus Nutzersicht: leerer Schlüsselring, nur der
          # ausgelieferte öffentliche Schlüssel darin. Genau so arbeitet apt.
          verify_home="${RUNNER_TEMP}/gnupg-verify"
          mkdir -p "$verify_home"; chmod 700 "$verify_home"
          GNUPGHOME="$verify_home" gpg --import packaging/srvpanel-archive-keyring.gpg
          GNUPGHOME="$verify_home" gpg --verify \
            "${RUNNER_TEMP}/probe.sig" "${RUNNER_TEMP}/probe.txt"
          echo "Ein apt-Client würde diese Signatur annehmen."

  ergebnis:
    name: Bereit für ein Release
    needs: [minisign, apt]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Beide Signaturschlüssel sind hinterlegt, passend und funktionsfähig."
