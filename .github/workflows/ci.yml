name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'

jobs:
  static:
    name: Statische Prüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sockets, pcntl, posix, mbstring, intl, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: composer.json prüfen
        run: composer validate --strict

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Der Agent hängt an nichts
        # Die Zusage aus §4.1: Was als root läuft, kommt ohne Composer aus.
        # Ein use-Statement auf einen vendor-Namensraum bricht sie — und weil
        # so etwas beim Lesen eines Diffs durchgeht, prüft es die CI.
        run: |
          if grep -rnE '^use (Illuminate|Symfony|Laravel|Inertia|Composer)\\' agent/src agent/bin; then
            echo "::error::Der Agent verweist auf eine Bibliothek der Anwendung."
            exit 1
          fi
          php -r 'require "agent/src/autoload.php";
                  new CloudSrv\Agent\Registry(new CloudSrv\Agent\Config());
                  if (class_exists("Composer\Autoload\ClassLoader", false)) { fwrite(STDERR, "vendor/ war geladen.\n"); exit(1); }
                  echo "Der Agent lädt ohne vendor/.\n";'

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sockets, pcntl, posix, mbstring, intl, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  ui:
    name: Oberfläche
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - name: Typen
        run: npm run types
      - name: Bundle
        run: npm run build

      - name: Farbwerte stehen nur in app.css
        # Vorgabe aus §7.2: Jede Farbe kommt aus den Marken. Ein Hexwert in
        # einer Komponente ist der Anfang vom Ende des zweiten Themes.
        run: |
          if grep -rnE '#[0-9a-fA-F]{3,8}\b' resources/js --include='*.vue' --include='*.ts'; then
            echo "::error::Farbwert außerhalb von app.css. Marke aus resources/css/app.css benutzen."
            exit 1
          fi
          echo "Keine Farbwerte außerhalb der Marken."

  integration:
    name: Installation auf ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Der Zweig, den es beim Vorgänger nicht gab — und der Grund, warum dort
    # eine systemd-Härtung jede Paketinstallation unmöglich machen konnte,
    # ohne dass ein Test es merkte. Hier läuft das gebaute Paket unter echtem
    # systemd auf jeder zugesagten Plattform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12
          - name: Debian 13
            image: debian:13
          - name: Ubuntu 22.04
            image: ubuntu:22.04
          - name: Ubuntu 24.04
            image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sockets, pcntl, posix, mbstring, intl, zip
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: nfpm bereitstellen
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Paket bauen
        run: packaging/build.sh 0.0.0-ci amd64

      - name: Container mit systemd starten
        run: |
          docker run -d --name target --privileged \
            --tmpfs /run --tmpfs /run/lock -v /sys/fs/cgroup:/sys/fs/cgroup:rw --cgroupns=host \
            -v "${PWD}/dist:/packages:ro" \
            ${{ matrix.image }} /bin/sh -c \
            'apt-get update -qq && apt-get install -y -qq systemd systemd-sysv >/dev/null && exec /sbin/init'
          for i in $(seq 1 60); do
            if docker exec target systemctl is-system-running 2>/dev/null | grep -qE 'running|degraded'; then break; fi
            sleep 2
          done
          docker exec target systemctl --version | head -1

      - name: Paket installieren
        run: |
          docker exec target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-fpm php-sockets php-mbstring php-xml php-curl php-mysql curl >/dev/null 2>&1 || true'
          docker exec target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/*.deb'

      - name: Der Agent läuft und antwortet
        run: |
          docker exec target systemctl is-active cloudsrv-agentd.service
          docker exec target /opt/cloudsrv/current/agent/bin/cloudsrv-agentd call agent.ping
          docker exec target /opt/cloudsrv/current/agent/bin/cloudsrv-agentd call system.info | head -5

      - name: Der Socket ist nicht für alle offen
        run: |
          mode="$(docker exec target stat -c '%a %U:%G' /run/cloudsrv/agent.sock)"
          echo "Socket: ${mode}"
          case "${mode}" in
            "660 root:cloudsrv") ;;
            *) echo "::error::Socket steht auf ${mode}, erwartet ist 660 root:cloudsrv"; exit 1 ;;
          esac

      - name: Ersteinrichtung und Oberfläche
        run: |
          docker exec target sh -c 'systemctl start mariadb || service mariadb start' || true
          sleep 5
          docker exec target cloudsrv setup --port=8443
          docker exec target curl -fsS -k https://127.0.0.1:8443/gesundheit
          echo

      - name: Ein zweiter Lauf der Ersteinrichtung ändert nichts
        # Wiederholbarkeit ist keine Kür: Wer nach einem Fehlschlag noch einmal
        # einrichtet, darf dabei nicht den Schlüssel wechseln — sonst ist die
        # Datenbank danach unlesbar.
        run: |
          vorher="$(docker exec target grep '^APP_KEY=' /etc/cloudsrv/panel.env)"
          docker exec target cloudsrv setup --port=8443 >/dev/null
          nachher="$(docker exec target grep '^APP_KEY=' /etc/cloudsrv/panel.env)"
          [ "$vorher" = "$nachher" ] || { echo "::error::Der APP_KEY hat sich beim zweiten Lauf geändert."; exit 1; }
          echo "Der Schlüssel ist geblieben."

      - name: Entfernen hinterlässt keine Dienste, aber die Daten
        run: |
          docker exec target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get remove -y cloudsrv-panel'
          ! docker exec target systemctl is-active cloudsrv-agentd.service
          docker exec target test -d /var/lib/cloudsrv

      - name: Aufräumen
        if: always()
        run: docker rm -f target || true

  scripts:
    name: Shell-Skripte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck packaging/install.sh packaging/scripts/*.sh
          shellcheck -e SC1091 packaging/bin/php packaging/bin/php-fpm packaging/bin/cloudsrv
          shellcheck -e SC1090 packaging/build.sh packaging/testbed.sh

  supply-chain:
    name: Schwachstellen und Lizenzen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: composer audit
        run: composer audit --no-interaction

      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

      - name: Lizenzen sind mit der AGPL vereinbar
        # §12.2 des Plans: Eine Abhängigkeit unter einer unvereinbaren Lizenz
        # muss auffallen, bevor sie im Paket landet — nicht danach.
        run: |
          composer licenses --format=json > /tmp/lizenzen.json
          php -r '
            $verboten = ["proprietary", "GPL-2.0-only", "GPL-2.0", "SSPL-1.0", "BUSL-1.1", "Elastic-2.0"];
            $daten = json_decode(file_get_contents("/tmp/lizenzen.json"), true);
            $treffer = [];
            foreach ($daten["dependencies"] ?? [] as $name => $paket) {
                foreach ((array) ($paket["license"] ?? []) as $lizenz) {
                    if (in_array($lizenz, $verboten, true)) { $treffer[] = $name . " (" . $lizenz . ")"; }
                }
            }
            if ($treffer) { fwrite(STDERR, "Unvereinbare Lizenzen: " . implode(", ", $treffer) . "\n"); exit(1); }
            echo "Alle Lizenzen sind mit AGPL-3.0-only vereinbar.\n";'
